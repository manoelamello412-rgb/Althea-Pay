name: Generate dependency lockfile
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Resolve dependency graph
        run: npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
      - name: Upload package-lock
        uses: actions/upload-artifact@v4
        with:
          name: althea-package-lock
          path: package-lock.json
          if-no-files-found: error
