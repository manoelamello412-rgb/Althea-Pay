# IARA closure validation remains branch-only; no Vercel deployment is requested.
# Final source validation checkpoint after checkout boundary convergence.
name: "IARA: Structural Validation"

on:
  push:
    branches: [ci/iara-validation]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: iara-structural-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: IARA authority graph
        shell: bash
        run: |
          set -euo pipefail
          test -f services/iara-agent/execution-kernel.ts
          test -f services/iara-agent/tool-registry.ts
          test -f services/iara-agent/authorization.ts
          test -f services/iara-agent/idempotency-store.ts
          test -f services/iara-agent/independent-execution-guardrail.ts
          test -f services/iara-agent/feb-ticket.ts
          test -f services/IaraIndependentEvaluator.ts
          grep -q 'from "./tool-registry"' services/iara-agent/execution-kernel.ts
          grep -q 'IaraFEBTicket' services/iara-agent/feb-ticket.ts
          grep -q 'requestFingerprint' services/iara-agent/feb-ticket.ts
          if grep -R -n --exclude-dir=node_modules --exclude-dir=.git 'from ["'"'"']\./registry["'"'"']' services app supabase/functions 2>/dev/null; then exit 1; fi
      - name: Kernel ordering invariant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services/iara-agent/execution-kernel.ts').read_text()
          guard = p.index('this.guardrail.beforeExecute')
          feb = p.index('issueFEBTicket(', p.index('if (tool.riskClass'))
          assert guard < feb, 'Guardrail must execute before FEB issuance.'
          PY
      - name: FEB issuer authorization evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/functions/iara-financial-command/index.ts
          grep -q 'organization_members' supabase/functions/iara-financial-command/index.ts
          grep -q 'confirmation_id' supabase/functions/iara-financial-command/index.ts
          grep -q 'evaluation_id' supabase/functions/iara-financial-command/index.ts
          grep -q 'INDEPENDENT_EVALUATOR_NOT_PASS' supabase/functions/iara-financial-command/index.ts
          grep -q 'RS256' supabase/functions/iara-financial-command/index.ts
          grep -q 'requestFingerprint' supabase/functions/iara-financial-command/index.ts
      - name: Financial boundary integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/functions/checkout-engine-v2/index.ts
          grep -q 'functions/v1/iara-financial-command' supabase/functions/checkout-engine-v2/index.ts
          grep -qi 'x-althea-feb-ticket-signature' supabase/functions/checkout-engine-v2/index.ts
          grep -q 'confirmation_id' supabase/functions/checkout-engine-v2/index.ts
          grep -q 'evaluation_id' supabase/functions/checkout-engine-v2/index.ts
          grep -q 'functions/v1/gateway-orchestrator' supabase/functions/checkout-engine-v2/index.ts
      - name: Fail-closed financial writers
        shell: bash
        run: |
          set -euo pipefail
          for f in supabase/functions/gateway-provider-adapter/index.ts supabase/functions/gateway-provider-adapter-v2/index.ts supabase/functions/gateway-payment-link/index.ts supabase/functions/gateway-refund/index.ts supabase/functions/gateway-refund-v2/index.ts supabase/functions/checkout-engine/index.ts; do
            if test -f "$f"; then grep -Eq '410|EXECUTION_UNAVAILABLE|RETIRED' "$f"; fi
          done
      - name: No PSP activation in IARA closure phase
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n --exclude-dir=node_modules --exclude-dir=.git --exclude='*.md' 'stripe\.com\|api\.adyen\.com\|mercadopago\.com' supabase/functions/iara-* supabase/functions/checkout-engine-v2 2>/dev/null
      - name: Unit tests
        run: npm test -- --run
