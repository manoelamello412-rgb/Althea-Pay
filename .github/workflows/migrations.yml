name: Supabase migration audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate repository migration safety
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/config.toml
          test -d supabase/migrations
          if grep -R --line-number --exclude='migrations.yml' -E 'supabase[[:space:]]+db[[:space:]]+push' .github scripts 2>/dev/null; then
            echo "Automatic supabase db push is forbidden while local and remote histories are being reconciled." >&2
            exit 1
          fi
          echo "Repository migration safety checks passed."

      - name: Detect remote audit credentials
        id: credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Remote migration comparison skipped: SUPABASE_DB_PASSWORD is not configured in GitHub Actions."
          fi

      - name: Setup Supabase CLI
        if: steps.credentials.outputs.available == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Compare local and remote migration history
        if: steps.credentials.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "hkraryqoziravulvqkid" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
          echo "Database deployment remains intentionally disabled in CI."
