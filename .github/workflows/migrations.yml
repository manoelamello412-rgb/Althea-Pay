name: Supabase migration audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate repository migration safety
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/config.toml
          test -d supabase/migrations
          if grep -R --line-number --exclude='migrations.yml' -E 'supabase[[:space:]]+db[[:space:]]+push' .github scripts 2>/dev/null; then
            echo "Automatic production supabase db push is review-gated and must not run from CI." >&2
            exit 1
          fi
          test ! -d supabase/migrations_legacy_pre_reconciliation
          bad_name=0
          for file in supabase/migrations/*.sql; do
            name="$(basename "$file")"
            if ! [[ "$name" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              echo "Non-canonical migration filename: $name" >&2
              bad_name=1
            fi
          done
          test "$bad_name" -eq 0
          duplicate_versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | cut -d_ -f1 | sort | uniq -d)"
          if [ -n "$duplicate_versions" ]; then
            echo "Duplicate migration versions: $duplicate_versions" >&2
            exit 1
          fi
          echo "Repository migration safety checks passed."

      - name: Detect remote audit credentials
        id: credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Remote migration comparison skipped: SUPABASE_DB_PASSWORD is not configured in GitHub Actions."
          fi

      - name: Setup Supabase CLI
        if: steps.credentials.outputs.available == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Compare local and remote migration history
        if: steps.credentials.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "hkraryqoziravulvqkid" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
          echo "Database deployment remains intentionally disabled in CI."
