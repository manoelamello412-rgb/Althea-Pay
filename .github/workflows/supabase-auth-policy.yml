name: Enforce Supabase Auth access policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-auth-policy.yml'
      - 'security/supabase-auth-policy.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate management credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Enforce invite-only Auth policy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: hkraryqoziravulvqkid
        run: |
          set -euo pipefail
          endpoint="https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth"

          current="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"             "${endpoint}")"

          echo "Current public-signup state:"
          printf '%s' "${current}" | jq '{disable_signup}'

          curl --fail-with-body --silent --show-error             -X PATCH             -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"             -H "Content-Type: application/json"             --data-binary @security/supabase-auth-policy.json             "${endpoint}" >/tmp/auth-config-after.json

          echo "Enforced public-signup state:"
          jq '{disable_signup}' /tmp/auth-config-after.json
          jq -e '.disable_signup == true' /tmp/auth-config-after.json >/dev/null
