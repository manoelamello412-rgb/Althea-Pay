name: Althea Core Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ALTHEA_INTERNAL_SECRET: ${{ secrets.ALTHEA_INTERNAL_SECRET }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$ALTHEA_INTERNAL_SECRET"
      - name: Run queue worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ALTHEA_INTERNAL_SECRET: ${{ secrets.ALTHEA_INTERNAL_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/core-worker" \
            -H 'content-type: application/json' \
            -H "x-internal-secret: $ALTHEA_INTERNAL_SECRET" \
            --data '{"limit":50}'
