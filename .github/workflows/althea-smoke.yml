name: ALTHEA PAY Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'tests/**'
      - '.github/workflows/althea-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply one-time funnel header behavior fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app/dashboard/funil/page.tsx')
          text = path.read_text()
          old_import = "  Search,\n"
          if old_import not in text:
              raise SystemExit('expected Search import not found')
          text = text.replace(old_import, '', 1)
          old_button = '''            <button type="button" aria-label="Buscar" className="flex h-9 w-9 items-center justify-center rounded-full text-zinc-400 transition hover:bg-white/[0.04] hover:text-white">\n              <Search className="h-[18px] w-[18px]" />\n            </button>\n'''
          if old_button not in text:
              raise SystemExit('expected static Search button not found')
          text = text.replace(old_button, '', 1)
          old_settings = '''            <button type="button" aria-label="Configurações" className="flex h-9 w-9 items-center justify-center rounded-full text-zinc-400 transition hover:bg-white/[0.04] hover:text-white">\n              <Settings className="h-[18px] w-[18px]" />\n            </button>\n'''
          new_settings = '''            <button type="button" aria-label="Configurações" title="Configurações" onClick={() => { window.location.assign('/dashboard/settings') }} className="flex h-9 w-9 items-center justify-center rounded-full text-zinc-400 transition hover:bg-white/[0.04] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/40">\n              <Settings className="h-[18px] w-[18px]" />\n            </button>\n'''
          if old_settings not in text:
              raise SystemExit('expected static Settings button not found')
          text = text.replace(old_settings, new_settings, 1)
          path.write_text(text)
          PY
          if git diff --quiet -- app/dashboard/funil/page.tsx; then
            echo 'No source change was produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/funil/page.tsx
          git commit -m 'fix: make funnel header controls functional'
          git push

      - name: Validate function configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/config.toml
          test -f supabase/functions/gateway-orchestrator/index.ts
          test -f supabase/functions/checkout-engine-v2/index.ts
          test -f supabase/functions/health/index.ts
          grep -q 'verify_jwt = true' supabase/config.toml
          grep -q '\[functions.gateway-orchestrator\]' supabase/config.toml
          grep -q '\[functions.checkout-engine-v2\]' supabase/config.toml

      - name: Health endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS https://hkraryqoziravulvqkid.supabase.co/functions/v1/health)"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"service":"althea-api"'

      - name: Verify protected function rejects anonymous calls
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/gateway-response.json -w '%{http_code}' -X POST \
            https://hkraryqoziravulvqkid.supabase.co/functions/v1/gateway-orchestrator \
            -H 'Content-Type: application/json' \
            --data '{"funnel_id":"smoke","amount":1,"idempotency_key":"smoke-anonymous"}')"
          cat /tmp/gateway-response.json
          test "$code" = "401"
