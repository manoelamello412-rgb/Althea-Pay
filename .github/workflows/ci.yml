name: CI

on:
  push:
    branches: [ ci-security-hardening, main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck (if present)
        run: |
          echo "Running typecheck (if present)"
          npm run typecheck --if-present || echo "typecheck script not present, skipping"

      - name: Run tests (if present)
        run: |
          echo "Running tests (if present)"
          npm test --if-present || echo "no tests or tests exited with non-zero (if-present)"
