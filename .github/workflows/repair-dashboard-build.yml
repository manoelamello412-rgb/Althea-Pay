name: Repair dashboard build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'Repair dashboard build') == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix TypeScript ReactNode error
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text()
          old = "<small>{funnel.url || funnel.endpoint || 'URL não configurada'}</small>"
          new = "<small>{String(funnel.url || funnel.endpoint || 'URL não configurada')}</small>"
          if old not in text:
              raise SystemExit('Expected dashboard expression not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Repair dashboard build"
          git push
