name: Load funnel token UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'chore: load funnel token UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add token manager script to static shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./funnel-tokens.js"></script>'
          if tag not in s:
              s=s.replace('<script src="./funnel-trash.js"></script>', '<script src="./funnel-trash.js"></script>'+tag)
              p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: load funnel token UI'
          git push
