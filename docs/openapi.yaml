openapi: 3.1.0
info:
  title: Althea Pay API
  version: 1.0.0
  description: Unified control-plane API for funnels, products, sales and gateway transactions. Althea Pay does not hold customer funds.
servers:
  - url: https://hkraryqoziravulvqkid.supabase.co/functions/v1/althea-public-api
security:
  - AltheaApiKey: []
paths:
  /v1/funnels:
    get:
      summary: List funnels
      responses: {'200': {description: OK}}
  /v1/funnels/{funnel_id}/operational-timeline:
    get:
      summary: Funnel operational timeline (events, payments, chat), newest first
      parameters:
        - {in: path, name: funnel_id, required: true, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {in: query, name: category, schema: {type: string}}
        - {in: query, name: severity, schema: {type: string}}
        - {in: query, name: source, schema: {type: string}}
        - {in: query, name: before, schema: {type: string, format: date-time}}
      responses: {'200': {description: OK}, '404': {description: Funnel not found}}
  /v1/products:
    get:
      summary: List products
      responses: {'200': {description: OK}}
  /v1/sales:
    get:
      summary: List sales
      responses: {'200': {description: OK}}
  /v1/transactions:
    get:
      summary: List gateway transactions
      responses: {'200': {description: OK}}
  /v1/events:
    post:
      summary: Ingest a funnel event
      description: Forwards to funnel-events with the key owner's identity. Send a stable event_id to make retries idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Event'}
      responses:
        '200': {description: Duplicate event_id, original event returned}
        '202': {description: Event accepted}
        '400': {description: Invalid event_type or missing funnel_id}
        '403': {description: Missing events:write scope}
        '404': {description: Funnel not found}
        '429': {description: Rate limit exceeded}
  /funnel-client-token:
    servers:
      - url: https://hkraryqoziravulvqkid.supabase.co/functions/v1
    post:
      summary: Issue a short-lived browser token (events:write, up to 10 minutes)
      description: |
        Two ways to authenticate:
        - Server side: send the funnel's secret ingestion token in x-funnel-event-token.
        - Page snippet (althea.js): send only funnel_id; the browser Origin must match the host of the funnel's registered page URL (www. ignored). Rate limited per IP.
      security: []
      parameters:
        - in: header
          name: x-funnel-event-token
          required: false
          schema: {type: string}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                funnel_id: {type: string, description: Required when no ingestion token is sent}
                ttl_seconds: {type: integer, minimum: 60, maximum: 600, default: 600}
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string, example: alt_fct_...}
                  token_type: {type: string, example: Bearer}
                  expires_in: {type: integer}
                  expires_at: {type: string, format: date-time}
                  funnel_id: {type: string}
                  event_endpoint: {type: string}
                  protocol_version: {type: string, example: '1'}
        '401': {description: No ingestion token and no funnel_id/Origin, or invalid ingestion token}
        '403': {description: Origin does not match the funnel page URL}
        '429': {description: Rate limit exceeded}
  /funnel-events:
    servers:
      - url: https://hkraryqoziravulvqkid.supabase.co/functions/v1
    post:
      summary: Ingest a funnel event directly from a page or server
      description: Accepts x-funnel-client-token (or Authorization Bearer alt_fct_...) from funnel-client-token, x-funnel-event-token, or an ALTHEA API key. The token's funnel must match funnel_id.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Event'}
      responses:
        '200': {description: Duplicate event_id, original event returned}
        '202': {description: Event accepted}
        '400': {description: Invalid event_type or missing funnel_id}
        '401': {description: Missing or invalid credential}
        '403': {description: Token bound to another funnel}
        '404': {description: Funnel not found}
        '413': {description: Payload too large (256 KB)}
        '422': {description: Unsupported protocol version or invalid chat_message payload}
        '429': {description: Rate limit exceeded}
components:
  securitySchemes:
    AltheaApiKey:
      type: apiKey
      in: header
      name: x-althea-api-key
  schemas:
    Event:
      type: object
      required: [event_type, funnel_id]
      properties:
        event_type: {type: string, description: 'Catalog type (page_view, quiz_started, checkout_started, payment_approved, chat_message, ...) or custom.<name>'}
        funnel_id: {type: string}
        event_id: {type: string, description: Stable id for idempotent retries (external_id also accepted)}
        visitor_id: {type: string}
        session_id: {type: string}
        page_url: {type: string}
        occurred_at: {type: string, format: date-time}
        source: {type: string}
        medium: {type: string}
        campaign: {type: string}
        content: {type: string}
        term: {type: string}
        click_id: {type: string}
        customer:
          type: object
          properties:
            name: {type: string}
            email: {type: string}
            phone: {type: string}
            customer_id: {type: string}
        payload: {type: object, additionalProperties: true}
