openapi: 3.0.0
info:
  title: Althea Pay (sandbox) API
  version: '0.1.0'
paths:
  /gateway-orchestrator:
    post:
      summary: Orchestrate a charge through sandbox gateways
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Charge'
      responses:
        '200':
          description: OK
components:
  schemas:
    Charge:
      type: object
      properties:
        amount:
          type: integer
        currency:
          type: string
