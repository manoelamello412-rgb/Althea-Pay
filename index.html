<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALTHEA PAY — Control Center</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#07070a;--panel:#111116;--line:#292934;--txt:#f8f8fb;--muted:#9b9ba8;--a:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#251343,transparent 35%),var(--bg);color:var(--txt);font:14px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{border-right:1px solid var(--line);background:#0c0c10;padding:18px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center}.mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#6d28d9,#a78bfa);font-weight:900}.brand b{letter-spacing:.08em}.brand small{display:block;color:var(--muted);margin-top:2px}.nav{margin-top:26px;display:grid;gap:4px}.nav button{border:0;background:none;color:var(--muted);padding:11px 12px;border-radius:10px;text-align:left}.nav button:hover,.nav button.active{background:#1c1727;color:#fff}.sidebottom{position:absolute;left:18px;right:18px;bottom:18px}.main{padding:28px;max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:27px}.top p{color:var(--muted);margin:5px 0}.user{color:var(--muted)}.section{display:none}.section.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:linear-gradient(180deg,#121217,#101014);border:1px solid var(--line);border-radius:16px;padding:17px}.label{color:var(--muted);font-size:12px}.value{font-size:25px;font-weight:800;margin-top:7px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.toolbar h2{margin:0}.primary,.secondary,.danger{border-radius:10px;padding:10px 14px;font-weight:700}.primary{border:0;background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff}.secondary{background:#18181d;border:1px solid var(--line);color:#fff}.danger{background:#321316;border:1px solid #6b1d25;color:#fecaca}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 9px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-size:12px}.pill{padding:5px 8px;border-radius:999px;background:#14251a;color:#86efac;font-size:11px}.pill.off{background:#292217;color:#fcd34d}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:40px;text-align:center;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:12px;padding:13px;background:#101014}.item strong{display:block}.item span{color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:10}.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;background:#111116;border:1px solid var(--line);border-radius:20px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}.close{background:none;border:0;color:var(--muted);font-size:22px}.field{margin:12px 0}.field label{display:block;color:#ddd;font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#09090d;color:#fff}.field textarea{min-height:90px}.notice{padding:10px;border-radius:10px;background:#18181d;border:1px solid var(--line);margin-bottom:12px}.err{color:#fecaca}.mobile{display:none}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);background:#111116;border:1px solid var(--line);border-radius:22px;padding:30px}.login h1{margin:18px 0 6px}.login p{color:var(--muted);line-height:1.5}.login .primary{width:100%;margin-top:8px}.link{border:0;background:none;color:#c4b5fd}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.mobile{display:flex;gap:6px;overflow:auto;padding:10px;border-bottom:1px solid var(--line);background:#0c0c10}.mobile button{white-space:nowrap;background:#17171c;border:1px solid var(--line);color:#aaa;border-radius:9px;padding:8px 10px}.main{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.user{display:none}}@media(max-width:520px){.cards{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.table{min-width:650px}.card{overflow:auto}}</style></head><body><div id="root"></div><script>
const URL='https://hkraryqoziravulvqkid.supabase.co',KEY='sb_publishable_ZC4p3GU0udH5eboge8QqeA_yhpJBXUl',sb=window.supabase.createClient(URL,KEY);let user=null,cache={funnels:[]};const root=document.getElementById('root');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function login(){root.innerHTML=`<main class="loginwrap"><section class="login"><div class="brand"><div class="mark">A</div><div><b>ALTHEA PAY</b><small>Control Center</small></div></div><h1>Entrar</h1><p>Centro de controle de funis, gateways, vendas, clientes, chats e integrações.</p><form id="lf"><div class="field"><label>E-mail</label><input id="e" type="email" required></div><div class="field"><label>Senha</label><input id="p" type="password" required minlength="6"></div><button class="primary">Entrar</button></form><div id="n"></div><p>Primeiro acesso? <button class="link" id="signup">Criar conta</button></p></section></main>`;lf.onsubmit=async x=>{x.preventDefault();let r=await sb.auth.signInWithPassword({email:e.value,password:p.value});if(r.error)n.innerHTML=`<div class="notice err">${esc(r.error.message)}</div>`;else boot()};signup.onclick=async()=>{let email=prompt('E-mail para criar a conta:');if(!email)return;let pass=prompt('Crie uma senha (mín. 6 caracteres):');if(!pass)return;let r=await sb.auth.signUp({email,password:pass});alert(r.error?r.error.message:'Conta criada. Confira seu e-mail se a confirmação estiver habilitada.')}}
function nav(){return [['overview','Visão geral'],['funnels','Funis'],['products','Produtos'],['gateways','Gateways'],['sales','Vendas'],['clients','Clientes'],['chats','Chats'],['analytics','Analytics'],['automations','Automações'],['integrations','Integrações'],['settings','Configurações'],['security','Segurança'],['logs','Auditoria']]}
function shell(){root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="mark">A</div><div><b>ALTHEA PAY</b><small>Control Center</small></div></div><nav class="nav">${nav().map(x=>`<button data-s="${x[0]}">${x[1]}</button>`).join('')}</nav><div class="sidebottom"><button class="secondary" style="width:100%" id="out">Sair</button></div></aside><div><div class="mobile">${nav().map(x=>`<button data-s="${x[0]}">${x[1]}</button>`).join('')}</div><main class="main"><div class="top"><div><h1 id="title">Visão geral</h1><p>Operação centralizada e monitorada.</p></div><div class="user">${esc(user?.email)}</div></div>${nav().map(x=>`<section id="sec-${x[0]}" class="section"></section>`).join('')}</main></div></div>`;document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>go(b.dataset.s));out.onclick=async()=>{await sb.auth.signOut();user=null;login()};go('overview')}
function go(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById('sec-'+id).classList.add('active');document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('active',b.dataset.s===id));document.getElementById('title').textContent=nav().find(x=>x[0]===id)?.[1]||id;render(id)}
async function render(id){let el=document.getElementById('sec-'+id);if(id==='overview')return overview(el);if(id==='funnels')return funnels(el);if(id==='gateways')return gateways(el);if(id==='automations')return automations(el);if(id==='settings')return settings(el);if(id==='security')return security(el);if(id==='logs')return logs(el);el.innerHTML=`<div class="card"><h2>${esc(nav().find(x=>x[0]===id)?.[1])}</h2><p style="color:var(--muted)">Módulo conectado ao Core. A próxima camada liga dados e ações em tempo real.</p></div>`}
async function count(t){let r=await sb.from(t).select('*',{count:'exact',head:true});return r.count||0}async function overview(el){let [f,p,s,e]=await Promise.all(['funnels','products','sales','integration_events'].map(count));el.innerHTML=`<div class="cards"><div class="card"><div class="label">Funis</div><div class="value">${f}</div></div><div class="card"><div class="label">Produtos</div><div class="value">${p}</div></div><div class="card"><div class="label">Vendas espelhadas</div><div class="value">${s}</div></div><div class="card"><div class="label">Eventos recebidos</div><div class="value">${e}</div></div></div><div class="grid2" style="margin-top:14px"><div class="card"><h3>Centro de saúde</h3><div class="list"><div class="item"><strong>Supabase</strong><span class="pill">Conectado</span></div><div class="item"><strong>Funis</strong><span>Monitoramento de conexão e última comunicação</span></div><div class="item"><strong>Eventos</strong><span>Recepção, idempotência e histórico preparados</span></div></div></div><div class="card"><h3>Arquitetura</h3><p style="color:var(--muted);line-height:1.6">ALTHEA funciona como camada de controle. O dinheiro permanece nos gateways externos. O Core espelha eventos, vendas e operação.</p></div></div>`}
async function funnels(el){let r=await sb.from('funnels').select('*').order('created_at',{ascending:false});cache.funnels=r.data||[];el.innerHTML=`<div class="toolbar"><div><h2>Seus funis</h2><p style="color:var(--muted)">Conecte, pause, desconecte ou remova sem apagar o funil externo.</p></div><button class="primary" onclick="openFunnel()">+ Conectar novo funil</button></div><div class="card">${cache.funnels.length?`<table class="table"><thead><tr><th>Funil</th><th>Status</th><th>Conexão</th><th>Última comunicação</th><th>Ações</th></tr></thead><tbody>${cache.funnels.map(f=>`<tr><td><strong>${esc(f.nome)}</strong><br><span style="color:var(--muted)">${esc(f.url||'Sem URL')}</span></td><td>${status(f.status)}</td><td>${f.endpoint?'API/Endpoint':'Script'}</td><td>${f.last_communication?new Date(f.last_communication).toLocaleString('pt-BR'):'—'}</td><td><div class="actions"><button class="secondary" onclick="editFunnel('${f.id}')">Editar</button><button class="secondary" onclick="disconnectFunnel('${f.id}')">Desconectar</button><button class="danger" onclick="deleteFunnel('${f.id}')">Excluir</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum funil conectado ainda. Comece pelo botão acima.</div>'}</div>`}
function status(s){s=s||'active';return `<span class="pill ${s==='active'?'':'off'}">${s==='active'?'Ativo':s==='disconnected'?'Desconectado':s}</span>`}function modal(title,body){let d=document.createElement('div');d.className='modal';d.id='modal';d.innerHTML=`<div class="modalbox"><div class="modalhead"><h3>${title}</h3><button class="close" onclick="modalClose()">×</button></div>${body}</div>`;document.body.appendChild(d)}function modalClose(){document.getElementById('modal')?.remove()}
function openFunnel(f){modal(f?'Editar funil':'Conectar novo funil',`<form id="ff"><div class="field"><label>Nome do funil</label><input id="fn" required value="${esc(f?.nome)}"></div><div class="field"><label>URL do funil</label><input id="fu" type="url" placeholder="https://..." value="${esc(f?.url)}"></div><div class="field"><label>Como ele foi construído?</label><select id="ct"><option value="script">Script / HTML</option><option value="api">API / Backend</option><option value="webhook">Webhook</option><option value="github">GitHub</option><option value="vercel">Vercel / Next.js</option><option value="wordpress">WordPress / CMS</option></select></div><div class="field"><label>Endpoint / código de conexão (opcional)</label><textarea id="ep" placeholder="Cole aqui o endpoint ou código quando tiver.">${esc(f?.endpoint)}</textarea></div><button class="primary">${f?'Salvar alterações':'Criar conexão'}</button></form><div id="fm" style="margin-top:10px"></div>`);ff.onsubmit=async x=>{x.preventDefault();let data={nome:fn.value.trim(),url:fu.value.trim()||null,endpoint:ep.value.trim()||null,status:f?.status||'active',user_id:user.id};let r=f?await sb.from('funnels').update(data).eq('id',f.id).eq('user_id',user.id):await sb.from('funnels').insert({id:crypto.randomUUID(),...data});if(r.error)fm.innerHTML=`<div class="notice err">${esc(r.error.message)}</div>`;else{modalClose();go('funnels')}}}
function editFunnel(id){openFunnel(cache.funnels.find(x=>x.id===id))}async function disconnectFunnel(id){if(!confirm('Desconectar este funil? O funil externo NÃO será apagado. O ALTHEA apenas interromperá a conexão.'))return;await sb.from('funnels').update({status:'disconnected'}).eq('id',id).eq('user_id',user.id);await sb.from('funnel_connections').update({status:'disconnected'}).eq('funnel_id',id).eq('user_id',user.id);go('funnels')}async function deleteFunnel(id){let f=cache.funnels.find(x=>x.id===id),typed=prompt(`Para excluir do ALTHEA, digite exatamente o nome do funil:\n\n${f?.nome||''}`);if(typed!==f?.nome)return alert('Exclusão cancelada.');await sb.from('funnel_connections').delete().eq('funnel_id',id).eq('user_id',user.id);let r=await sb.from('funnels').delete().eq('id',id).eq('user_id',user.id);if(r.error)alert(r.error.message);else go('funnels')}
async function gateways(el){let r=await sb.from('gateways').select('*').order('created_at',{ascending:false}),rows=r.data||[];el.innerHTML=`<div class="toolbar"><div><h2>Gateways</h2><p style="color:var(--muted)">Arquitetura multi-gateway. O dinheiro continua no provedor externo.</p></div><button class="primary" onclick="openGateway()">+ Adicionar gateway</button></div><div class="card">${rows.length?`<table class="table"><tr><th>Gateway</th><th>Ambiente</th><th>Status</th><th>Ações</th></tr>${rows.map(g=>{let d=g.data||{};return `<tr><td><strong>${esc(d.name||'Gateway')}</strong><br><span style="color:var(--muted)">${esc(d.provider||'custom')}</span></td><td>${esc(d.environment||'sandbox')}</td><td>${status(d.status||'active')}</td><td><button class="danger" onclick="removeGateway('${g.id}')">Excluir</button></td></tr>`}).join('')}</table>`:'<div class="empty">Nenhum gateway cadastrado. O Sandbox pode ser criado agora.</div>'}</div>`}function openGateway(){modal('Adicionar gateway',`<form id="gf"><div class="field"><label>Nome</label><input id="gn" required placeholder="Gateway Sandbox"></div><div class="field"><label>Provedor</label><input id="gp" value="simulated"></div><div class="field"><label>Ambiente</label><select id="ge"><option>sandbox</option><option>production</option></select></div><button class="primary">Salvar gateway</button></form>`);gf.onsubmit=async x=>{x.preventDefault();let r=await sb.from('gateways').insert({id:crypto.randomUUID(),user_id:user.id,data:{name:gn.value,provider:gp.value,environment:ge.value,status:'active'}});if(r.error)alert(r.error.message);else{modalClose();go('gateways')}}}async function removeGateway(id){if(confirm('Excluir este gateway do ALTHEA?')){await sb.from('gateways').delete().eq('id',id).eq('user_id',user.id);go('gateways')}}
async function automations(el){let r=await sb.from('automation_rules').select('*').order('created_at',{ascending:false}),rows=r.data||[];el.innerHTML=`<div class="toolbar"><div><h2>Automações</h2><p style="color:var(--muted)">Regras para transformar eventos em ações.</p></div><button class="primary" onclick="openAutomation()">+ Nova automação</button></div><div class="card">${rows.length?rows.map(x=>`<div class="item" style="margin-bottom:8px"><strong>${esc(x.name)}</strong><span>${esc(x.status)} · ${esc(x.trigger_config?.event||'evento')} → ${esc(x.action_config?.action||'ação')}</span></div>`).join(''):'<div class="empty">Nenhuma automação criada.</div>'}</div>`}function openAutomation(){modal('Nova automação',`<form id="af"><div class="field"><label>Nome</label><input id="an" required placeholder="Recuperar checkout abandonado"></div><div class="field"><label>Evento gatilho</label><select id="ae"><option>checkout_started</option><option>purchase</option><option>payment_failed</option><option>lead_created</option><option>webhook_failed</option><option>chat_started</option></select></div><div class="field"><label>Ação</label><select id="aa"><option>notify</option><option>send_message</option><option>create_task</option><option>retry_webhook</option><option>tag_client</option></select></div><button class="primary">Criar regra</button></form>`);af.onsubmit=async x=>{x.preventDefault();let r=await sb.from('automation_rules').insert({user_id:user.id,name:an.value,status:'draft',trigger_config:{event:ae.value},action_config:{action:aa.value}});if(r.error)alert(r.error.message);else{modalClose();go('automations')}}}
async function settings(el){let r=await sb.from('platform_settings').select('*').eq('user_id',user.id).maybeSingle(),d=r.data?.data||{};el.innerHTML=`<div class="grid2"><div class="card"><h2>Configurações gerais</h2><form id="sf"><div class="field"><label>Nome da operação</label><input id="sn" value="${esc(d.name||'ALTHEA PAY')}"></div><div class="field"><label>Idioma</label><select id="sl"><option ${d.language==='pt-BR'?'selected':''}>pt-BR</option><option ${d.language==='en'?'selected':''}>en</option><option ${d.language==='es'?'selected':''}>es</option></select></div><div class="field"><label>Moeda</label><select id="sc"><option ${d.currency==='BRL'?'selected':''}>BRL</option><option>USD</option><option>EUR</option></select></div><div class="field"><label>Fuso horário</label><input id="st" value="${esc(d.timezone||'America/Sao_Paulo')}"></div><button class="primary">Salvar configurações</button></form></div><div class="card"><h2>Próximas camadas</h2><div class="list"><div class="item"><strong>White-label</strong><span>Marca pública dos funis sem ALTHEA.</span></div><div class="item"><strong>API & Webhooks</strong><span>Chaves, scopes, assinatura, retry e replay.</span></div><div class="item"><strong>Attribution</strong><span>UTM → sessão → lead → checkout → compra.</span></div><div class="item"><strong>IA operacional</strong><span>Detecção de gargalos e recomendações.</span></div></div></div></div>`;sf.onsubmit=async x=>{x.preventDefault();let r=await sb.from('platform_settings').upsert({user_id:user.id,data:{name:sn.value,language:sl.value,currency:sc.value,timezone:st.value},updated_at:new Date().toISOString()});alert(r.error?r.error.message:'Configurações salvas.')}}
async function security(el){el.innerHTML=`<div class="grid2"><div class="card"><h2>Segurança</h2><div class="list"><div class="item"><strong>RLS</strong><span class="pill">Ativo</span></div><div class="item"><strong>Controle por usuário</strong><span>Dados isolados por conta.</span></div><div class="item"><strong>Permissões de equipe</strong><span>Owner · Admin · Manager · Operator · Supervisor · Viewer.</span></div><div class="item"><strong>2FA</strong><span>Camada preparada para ativação no fluxo de segurança.</span></div></div></div><div class="card"><h2>Credenciais</h2><p style="color:var(--muted);line-height:1.6">Segredos de gateways devem permanecer fora do navegador. O painel público usa apenas chave publicável do Supabase.</p></div></div>`}async function logs(el){let r=await sb.from('logs').select('*').order('created_at',{ascending:false}).limit(50),rows=r.data||[];el.innerHTML=`<div class="card"><h2>Auditoria</h2>${rows.length?rows.map(x=>`<div class="item" style="margin:8px 0"><strong>${esc(x.action||'ação')}</strong><span>${esc(x.resource||'')} · ${esc(x.details||'')} · ${x.created_at?new Date(x.created_at).toLocaleString('pt-BR'):''}</span></div>`).join(''):'<div class="empty">Nenhum registro ainda.</div>'}</div>`}
async function boot(){let r=await sb.auth.getSession();if(r.data.session){user=r.data.session.user;shell()}else login()}sb.auth.onAuthStateChange((_e,s)=>{if(s&&!user){user=s.user;shell()}else if(!s&&user){user=null;login()}});boot();
</script></body></html>
