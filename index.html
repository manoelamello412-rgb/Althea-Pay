<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>ALTHEA PAY — Control Center</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#08080a;--p:#111114;--p2:#17171b;--line:#29292e;--txt:#f8f8fa;--muted:#a1a1aa;--a:#8b5cf6;--a2:#c4b5fd;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{border-right:1px solid var(--line);background:#0c0c0e;padding:20px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:11px;align-items:center}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#6d28d9,#a855f7);font-weight:900;box-shadow:0 10px 30px #7c3aed44}.brand b{letter-spacing:.08em}.brand small{display:block;color:var(--muted);margin-top:3px}.nav{margin-top:28px;display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px;border-radius:10px}.nav button:hover,.nav button.active{background:#1b1723;color:#fff}.logout{position:absolute;left:20px;right:20px;bottom:20px}.main{padding:28px 34px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{font-size:26px;margin:0}.top p{color:var(--muted);margin:5px 0 0}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#27272a;display:grid;place-items:center;font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:18px}.label{color:var(--muted);font-size:12px}.num{font-size:26px;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:15px;margin-top:15px}.section{display:none}.section.active{display:block}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:10px}.toolbar h2{margin:0}.primary,.secondary,.danger{border-radius:10px;padding:10px 14px;font-weight:700}.primary{border:0;background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff}.secondary{border:1px solid var(--line);background:#18181b;color:#fff}.danger{border:1px solid #7f1d1d;background:#351315;color:#fecaca}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-weight:600}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px}.ok{background:#10251a;color:#86efac}.warn{background:#2b210e;color:#fcd34d}.off{background:#252529;color:#a1a1aa}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;padding:35px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:10}.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#111114;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 30px 100px #000}.modalbox h2{margin-top:0}.field{margin:12px 0}.field label{display:block;color:#d4d4d8;font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#09090b;color:#fff;outline:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{padding:10px 12px;border-radius:10px;margin-bottom:14px;background:#18181b;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#24133f,#08080a 45%);padding:20px}.loginbox{width:min(430px,100%);background:#111114;border:1px solid var(--line);border-radius:22px;padding:30px}.loginbox h1{margin-bottom:5px}.loginbox p{color:var(--muted);line-height:1.5}.loginbox .field{margin:15px 0}.loginbox button.primary{width:100%}.link{background:none;border:0;color:var(--a2);font-weight:700}.mobile{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.mobile{display:flex;gap:5px;overflow:auto;padding:10px;border-bottom:1px solid var(--line)}.mobile button{white-space:nowrap;background:#18181b;color:#aaa;border:1px solid var(--line);border-radius:9px;padding:8px}.main{padding:20px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:560px){.cards{grid-template-columns:1fr}.row{grid-template-columns:1fr}.user span{display:none}.table{min-width:720px}.card{overflow:auto}}
</style></head><body><div id="root"></div><script>
const URL='https://hkraryqoziravulvqkid.supabase.co',KEY='sb_publishable_ZC4p3GU0udH5eboge8QqeA_yhpJBXUl',sb=window.supabase.createClient(URL,KEY);let user=null,section='overview';const root=document.getElementById('root');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function login(){root.innerHTML=`<main class="login"><section class="loginbox"><div class="brand"><div class="mark">A</div><div><b>ALTHEA PAY</b><small>Control Center</small></div></div><h1>Entrar no ALTHEA PAY</h1><p>Controle seus funis, gateways, vendas, clientes e chats em um único lugar.</p><form id="f"><div class="field"><label>E-mail</label><input id="e" type="email" required></div><div class="field"><label>Senha</label><input id="s" type="password" minlength="6" required></div><button class="primary">Entrar</button><div id="n" class="notice hidden"></div></form></section></main>`;f.onsubmit=async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:e.value.trim(),password:s.value});if(r.error)n.textContent=r.error.message,n.className='notice';else render(r.data.user)}}
const labels={overview:'Visão geral',funnels:'Funis',products:'Produtos',gateways:'Gateways',sales:'Vendas',clients:'Clientes',chats:'Chats',analytics:'Analytics',integrations:'Integrações',automations:'Automações',settings:'Configurações'};
function render(u){user=u;root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="mark">A</div><div><b>ALTHEA PAY</b><small>Control Center</small></div></div><nav class="nav" id="nav">${Object.keys(labels).map(k=>`<button data-s="${k}" class="${k===section?'active':''}">${labels[k]}</button>`).join('')}</nav><button id="out" class="secondary logout" style="width:calc(100% - 40px)">Sair</button></aside><div><div class="mobile">${Object.keys(labels).map(k=>`<button data-s="${k}">${labels[k]}</button>`).join('')}</div><main class="main"><header class="top"><div><h1 id="title"></h1><p id="sub"></p></div><div class="user"><span>${esc(u.email)}</span><div class="avatar">${esc((u.email||'A')[0].toUpperCase())}</div></div></header><div id="content"></div></main></div></div>`;document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{section=b.dataset.s;render(user)});out.onclick=async()=>{await sb.auth.signOut();login()};draw()}
async function count(t){const r=await sb.from(t).select('*',{count:'exact',head:true});return r.error?0:r.count||0}
async function draw(){title.textContent=labels[section];sub.textContent=section==='overview'?'Controle central da sua operação.':'Gerencie este módulo do ALTHEA PAY.';if(section==='overview')return overview();if(section==='funnels')return funnels();if(section==='gateways')return gateways();if(section==='automations')return automations();if(section==='settings')return settings();content.innerHTML=`<div class="card"><h2>${labels[section]}</h2><p style="color:var(--muted)">Este núcleo já está reservado na arquitetura. A próxima camada conectará o módulo aos dados e eventos reais.</p></div>`}
async function overview(){const [a,b,c,d,e]=await Promise.all([count('funnels'),count('products'),count('sales'),count('chats'),count('integration_events')]);content.innerHTML=`<div class="cards"><div class="card"><div class="label">Funis</div><div class="num">${a}</div></div><div class="card"><div class="label">Produtos</div><div class="num">${b}</div></div><div class="card"><div class="label">Vendas espelhadas</div><div class="num">${c}</div></div><div class="card"><div class="label">Eventos recebidos</div><div class="num">${e}</div></div></div><div class="grid"><div class="card"><h3>Arquitetura ativa</h3><p style="color:var(--muted);line-height:1.7">Multi-funil · Multi-produto · Multi-gateway · Eventos · Automações · White-label de chat · Controle de conexões.</p></div><div class="card"><h3>Saúde</h3><p><span class="badge ok">Supabase conectado</span></p><p><span class="badge ok">Core preparado</span></p></div></div>`}
async function funnels(){const r=await sb.from('funnels').select('*').order('created_at',{ascending:false});const rows=r.data||[];content.innerHTML=`<div class="toolbar"><h2>Seus funis</h2><button class="primary" onclick="openFunnel()">+ Conectar novo funil</button></div><div class="card">${rows.length?`<table class="table"><thead><tr><th>Funil</th><th>URL</th><th>Status</th><th>Última comunicação</th><th>Ações</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.nome)}</b><br><small style="color:var(--muted)">${esc(x.id)}</small></td><td>${esc(x.url||'—')}</td><td><span class="badge ${x.status==='active'?'ok':x.status==='paused'?'warn':'off'}">${esc(x.status||'active')}</span></td><td>${x.last_communication?new Date(x.last_communication).toLocaleString('pt-BR'):'Nunca'}</td><td><div class="actions"><button class="secondary" onclick='editFunnel(${JSON.stringify(x)})'>Editar</button><button class="secondary" onclick='toggleFunnel(${JSON.stringify(x)})'>${x.status==='active'?'Pausar':'Ativar'}</button><button class="secondary" onclick='disconnectFunnel(${JSON.stringify(x)})'>Desconectar</button><button class="danger" onclick='deleteFunnel(${JSON.stringify(x)})'>Excluir</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum funil conectado. Comece em “Conectar novo funil”.</div>'}</div>`}
function modal(html){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><section class="modalbox">${html}</section></div>`)}function closeM(){document.getElementById('modal')?.remove()}
function openFunnel(x={}){modal(`<h2>${x.id?'Editar funil':'Conectar novo funil'}</h2><p style="color:var(--muted)">${x.id?'Atualize a conexão.':'Você não precisa saber programar. O assistente guarda o tipo de conexão e as instruções para instalação.'}</p><form id="ff"><div class="field"><label>Nome do funil</label><input id="fn" required value="${esc(x.nome||'')}"></div><div class="field"><label>URL do funil</label><input id="fu" type="url" placeholder="https://..." value="${esc(x.url||'')}"></div><div class="row"><div class="field"><label>Tipo de conexão</label><select id="ft"><option value="script">Script / SDK</option><option value="webhook">Webhook</option><option value="api">API</option><option value="github">GitHub</option><option value="vercel">Vercel</option><option value="cms">CMS / WordPress</option></select></div><div class="field"><label>Endpoint / código</label><input id="fe" value="${esc(x.endpoint||'')}"></div></div><div id="mn" class="notice hidden"></div><div class="modalfoot"><button type="button" class="secondary" onclick="closeM()">Cancelar</button><button class="primary">${x.id?'Salvar':'Conectar'}</button></div></form>`);ff.onsubmit=async e=>{e.preventDefault();const payload={nome:fn.value.trim(),url:fu.value.trim(),endpoint:fe.value.trim(),status:x.status||'active',user_id:user.id};const q=x.id?sb.from('funnels').update(payload).eq('id',x.id).eq('user_id',user.id):sb.from('funnels').insert({...payload,id:crypto.randomUUID()});const r=await q;if(r.error)mn.textContent=r.error.message,mn.className='notice';else{if(x.id)await sb.from('funnel_connections').update({connection_type:ft.value,status:'active',updated_at:new Date().toISOString()}).eq('funnel_id',x.id).eq('user_id',user.id);closeM();funnels()}}}
function editFunnel(x){openFunnel(x)}
async function toggleFunnel(x){const status=x.status==='active'?'paused':'active';await sb.from('funnels').update({status}).eq('id',x.id).eq('user_id',user.id);funnels()}
async function disconnectFunnel(x){if(!confirm(`Desconectar “${x.nome}”? Os dados históricos do ALTHEA serão preservados.`))return;await sb.from('funnel_connections').update({status:'disconnected',updated_at:new Date().toISOString()}).eq('funnel_id',x.id).eq('user_id',user.id);await sb.from('funnels').update({status:'disconnected'}).eq('id',x.id).eq('user_id',user.id);funnels()}
async function deleteFunnel(x){if(!confirm(`Excluir “${x.nome}” do ALTHEA PAY? O funil externo NÃO será apagado. O registro do ALTHEA e sua conexão serão removidos.`))return;const typed=prompt('Para confirmar, digite EXCLUIR');if(typed!=='EXCLUIR')return;await sb.from('funnel_connections').delete().eq('funnel_id',x.id).eq('user_id',user.id);await sb.from('funnels').delete().eq('id',x.id).eq('user_id',user.id);await sb.from('integration_events').delete().eq('funnel_id',x.id).eq('user_id',user.id);funnels()}
async function gateways(){const r=await sb.from('gateways').select('*').order('created_at',{ascending:false});const rows=r.data||[];content.innerHTML=`<div class="toolbar"><h2>Gateways</h2><button class="primary" onclick="openGateway()">+ Adicionar gateway</button></div><div class="card">${rows.length?`<table class="table"><thead><tr><th>Nome</th><th>Modo</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(x=>{let d=x.data||{};return `<tr><td><b>${esc(d.name||d.nome||x.id)}</b></td><td>${esc(d.mode||'sandbox')}</td><td><span class="badge ${d.status==='inactive'?'off':'ok'}">${esc(d.status||'active')}</span></td><td><div class="actions"><button class="secondary" onclick='editGateway(${JSON.stringify(x)})'>Editar</button><button class="danger" onclick='removeGateway(${JSON.stringify(x)})'>Excluir</button></div></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Nenhum gateway cadastrado. O primeiro modo disponível é Sandbox/Teste.</div>'}</div>`}
function openGateway(x={}){const d=x.data||{};modal(`<h2>${x.id?'Editar gateway':'Adicionar gateway'}</h2><p style="color:var(--muted)">O modo Sandbox permite testar a operação sem movimentar dinheiro real.</p><form id="gf"><div class="field"><label>Nome</label><input id="gn" required value="${esc(d.name||'Gateway Sandbox')}"></div><div class="row"><div class="field"><label>Modo</label><select id="gm"><option value="sandbox">Sandbox / Teste</option><option value="production">Produção</option></select></div><div class="field"><label>Tipo</label><select id="gt"><option>simulated</option><option>api</option><option>custom</option></select></div></div><div class="field"><label>Configuração (opcional)</label><textarea id="gc" rows="5" placeholder='{"endpoint":"..."}'>${esc(JSON.stringify(d.config||{},null,2))}</textarea></div><div id="gnote" class="notice hidden"></div><div class="modalfoot"><button type="button" class="secondary" onclick="closeM()">Cancelar</button><button class="primary">Salvar</button></div></form>`);gf.onsubmit=async e=>{e.preventDefault();let config={};try{config=JSON.parse(gc.value||'{}')}catch(_){gnote.textContent='Configuração precisa ser JSON válido';gnote.className='notice';return}const data={...d,name:gn.value.trim(),mode:gm.value,type:gt.value,status:'active',config};const q=x.id?sb.from('gateways').update({data}).eq('id',x.id).eq('user_id',user.id):sb.from('gateways').insert({id:crypto.randomUUID(),user_id:user.id,data});const r=await q;if(r.error)gnote.textContent=r.error.message,gnote.className='notice';else closeM(),gateways()}}
function editGateway(x){openGateway(x)}async function removeGateway(x){if(confirm('Excluir este gateway do ALTHEA?')){await sb.from('gateways').delete().eq('id',x.id).eq('user_id',user.id);gateways()}}
async function automations(){const r=await sb.from('automation_rules').select('*').order('created_at',{ascending:false});content.innerHTML=`<div class="toolbar"><h2>Automações</h2><button class="primary" onclick="newAutomation()">+ Nova automação</button></div><div class="card">${r.data?.length?r.data.map(x=>`<div style="padding:14px 0;border-bottom:1px solid var(--line)"><b>${esc(x.name)}</b> <span class="badge ${x.status==='active'?'ok':'off'}">${esc(x.status)}</span><p style="color:var(--muted)">${esc(JSON.stringify(x.trigger_config))} → ${esc(JSON.stringify(x.action_config))}</p></div>`).join(''):'<div class="empty">Nenhuma automação criada.</div>'}</div>`}
function newAutomation(){modal(`<h2>Nova automação</h2><form id="af"><div class="field"><label>Nome</label><input id="an" required placeholder="Recuperar checkout abandonado"></div><div class="row"><div class="field"><label>Gatilho</label><select id="at"><option>checkout_abandoned</option><option>purchase</option><option>payment_failed</option><option>lead_created</option><option>webhook_failed</option></select></div><div class="field"><label>Ação</label><select id="aa"><option>notify_team</option><option>send_message</option><option>create_task</option><option>retry_webhook</option></select></div></div><div class="modalfoot"><button type="button" class="secondary" onclick="closeM()">Cancelar</button><button class="primary">Criar</button></div></form>`);af.onsubmit=async e=>{e.preventDefault();await sb.from('automation_rules').insert({user_id:user.id,name:an.value,status:'draft',trigger_config:{event:at.value},action_config:{action:aa.value}});closeM();automations()}}
async function settings(){const r=await sb.from('platform_settings').select('data').eq('user_id',user.id).maybeSingle();const d=r.data?.data||{};content.innerHTML=`<div class="card"><h2>Configurações da conta</h2><form id="sf"><div class="row"><div class="field"><label>Nome da operação</label><input id="sn" value="${esc(d.name||'ALTHEA PAY')}"></div><div class="field"><label>Idioma</label><select id="sl"><option ${d.language==='pt-BR'?'selected':''}>pt-BR</option><option ${d.language==='en'?'selected':''}>en</option><option ${d.language==='es'?'selected':''}>es</option></select></div></div><div class="row"><div class="field"><label>Moeda</label><select id="sc"><option>BRL</option><option>USD</option><option>EUR</option></select></div><div class="field"><label>Fuso horário</label><input id="st" value="${esc(d.timezone||'America/Sao_Paulo')}"></div></div><button class="primary">Salvar configurações</button></form></div>`;sf.onsubmit=async e=>{e.preventDefault();await sb.from('platform_settings').upsert({user_id:user.id,data:{name:sn.value,language:sl.value,currency:sc.value,timezone:st.value},updated_at:new Date().toISOString()});alert('Configurações salvas.')}}
sb.auth.getSession().then(r=>r.data.session?render(r.data.session.user):login());sb.auth.onAuthStateChange((_,s)=>{if(s&&!user)render(s.user)});
</script></body></html>
