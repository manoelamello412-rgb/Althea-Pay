<!DOCTYPE html>
<html lang="pt-BR">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTHEA PAY - Centro de Controle Real</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif} .mono{font-family:'JetBrains Mono',monospace} ::-webkit-scrollbar{width:5px;height:5px} ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:10px}</style>
</head>
<body class="bg-[#f6f6f7] text-zinc-900">
<div id="app"></div>
<div id="modalRoot" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden"></div>
<script>
const KEY='anthea_pay_v3_real';
function emptyDB(){return {funnels:[],products:[],pixConfigs:[],pixHistory:[],gateways:[],clients:[],leads:[],sales:[],chats:[],messages:[],collaborators:[{id:'COL-001',name:'Rafaela Julio',email:'rafaela@anthea.pay',role:'Administrador',status:'ativo',permissions:{all:true},createdAt:new Date().toISOString()}],apiKeys:[],webhooks:[],logs:[],backups:[],settings:{appName:'ANTHEA PAY',domain:''}}}
function loadDB(){try{let d=localStorage.getItem(KEY); if(!d){let e=emptyDB(); localStorage.setItem(KEY,JSON.stringify(e)); return e;} return JSON.parse(d);}catch(e){return emptyDB();}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db));}
function uid(p){return p+'-'+Math.random().toString(36).slice(2,7).toUpperCase()+'-'+Date.now().toString().slice(-4);}
function logA(user,action,resource,details){db.logs.unshift({id:uid('LOG'),user,action,resource,details:details||'',createdAt:new Date().toISOString()}); saveDB();}
let db=loadDB();
let view='dashboard', selected=null, modalHTML=null, search='';
let aiChat=[];
let aiSettings={activeProvider:'openai', requireApproval:true, allowFunnelEdits:true, allowPixEdits:false, autoBackup:true, history:[]};
let aiProviders={openai:{id:'openai',name:'OpenAI',model:'gpt-5.6',apiKey:'',active:true},claude:{id:'claude',name:'Claude',model:'claude-sonnet',apiKey:'',active:false},meta:{id:'meta',name:'Meta AI',model:'meta-ai',apiKey:'',active:false}};
try{const savedAI=JSON.parse(localStorage.getItem('anthea_pay_ai_core')||'null');if(savedAI){aiChat=savedAI.aiChat||[];aiSettings={...aiSettings,...(savedAI.aiSettings||{})};aiProviders={...aiProviders,...(savedAI.aiProviders||{})};}}catch(e){}
function saveAIState(){localStorage.setItem('anthea_pay_ai_core',JSON.stringify({aiChat,aiSettings,aiProviders}));}

const menu=[['dashboard','Dashboard','◧'],['ai','IA Core Universal','🧠'],['funnels','Funis','⟁'],['products','Produtos','◍'],['pix','Pix / QR','₿'],['gateways','Gateways','⇄'],['clients','Clientes','◐'],['leads','Leads','◑'],['sales','Vendas','⟡'],['chats','Chat ao Vivo','✦'],['integrations','Integrações','◈'],['api','API & Webhooks','</>'],['team','Equipe','◎'],['logs','Logs','≡'],['settings','Configurações','⚙'],['backup','Backup','⬇']];

function render(){
let isEmpty=db.funnels.length===0 && db.sales.length===0 && db.clients.length===0;
document.getElementById('app').innerHTML=`
<div class="min-h-screen flex">
<aside class="hidden lg:flex w-[272px] bg-[#0a0a0a] text-white flex-col fixed h-screen">
<div class="p-6 border-b border-zinc-800"><div class="flex items-center gap-3"><div class="w-9 h-9 bg-white text-black rounded-xl flex items-center justify-center font-bold text-[16px]">A</div><div><div class="font-bold tracking-tight leading-none">ANTHEA PAY</div><div class="text-[10px] mono mt-1 ${isEmpty?'text-amber-400':'text-emerald-400'}">${isEmpty?'MODO DEMONSTRAÇÃO':'SISTEMA REAL • BANCO CONECTADO'}</div></div></div></div>
<nav class="flex-1 overflow-y-auto p-3 space-y-1">${menu.map(([k,l,i])=>`<button onclick="nav('${k}')" class="w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-3 text-[13px] ${view===k?'bg-white text-black font-medium':'text-zinc-400 hover:text-white hover:bg-zinc-900'}"><span class="w-5 text-center">${i}</span>${l}${k==='chats'&&db.chats.length?`<span class="ml-auto bg-white text-black text-[10px] px-1.5 py-0.5 rounded-full">${db.chats.length}</span>`:''}</button>`).join('')}</nav>
<div class="p-4 border-t border-zinc-800"><div class="text-[10px] mono text-zinc-500 leading-relaxed">DB: localStorage real<br>ID: ANT-FUN-001<br>Chat-ID: CHAT-000001<br>NUNCA dados fictícios</div><button onclick="exportDB()" class="mt-3 w-full border border-zinc-700 rounded-full py-2 text-xs">Exportar DB Real</button></div>
</aside>
<main class="flex-1 lg:ml-[272px]">
<div class="sticky top-0 bg-white/80 backdrop-blur-xl border-b border-zinc-200 z-20 px-4 lg:px-8 py-3 flex items-center gap-3">
<button class="lg:hidden border rounded-full px-3 py-1 text-xs" onclick="document.querySelector('aside').classList.toggle('hidden');document.querySelector('aside').classList.toggle('flex')">Menu</button>
<div class="flex-1 relative"><input id="globalSearch" value="${search}" oninput="search=this.value.toLowerCase(); renderMain()" placeholder="Pesquisa global: clientes, funis, chats, logs, vendas..." class="w-full bg-zinc-100 rounded-full pl-10 pr-4 py-2.5 text-[13px] outline-none focus:ring-2 focus:ring-black"><span class="absolute left-4 top-3 text-zinc-400 text-sm">⌕</span></div>
<div class="hidden md:flex items-center gap-2"><span class="text-[11px] mono text-zinc-500">${db.logs.length} logs auditados</span><div class="w-8 h-8 bg-black text-white rounded-full flex items-center justify-center text-xs font-bold">RJ</div></div>
</div>
${isEmpty?`<div class="mx-4 lg:mx-8 mt-4 bg-amber-50 border border-amber-200 rounded-2xl px-4 py-3 flex gap-3 items-start"><div class="w-8 h-8 bg-amber-500 text-white rounded-full flex items-center justify-center text-xs">!</div><div><div class="font-semibold text-sm">MODO DEMONSTRAÇÃO - Aguardando Conexão Real</div><div class="text-xs text-zinc-600 mt-1">Nenhum dado real recebido ainda. O sistema NUNCA inventa vendas, clientes ou pagamentos. Conecte um funil, gateway ou importe dados para sair deste modo.</div></div></div>`:''}
<div id="main" class="p-4 lg:p-8 pb-28">${renderMain()}</div>
</main>
</div>
<div class="lg:hidden fixed bottom-0 left-0 right-0 bg-black text-white flex justify-around py-2.5 z-30 border-t border-zinc-800">${[['dashboard','◧'],['funnels','⟁'],['sales','⟡'],['chats','✦'],['settings','⚙']].map(([k,i])=>`<button onclick="nav('${k}')" class="flex flex-col items-center text-[10px] ${view===k?'text-white':'text-zinc-500'}"><span class="text-[18px]">${i}</span>${k}</button>`).join('')}</div>
`;
let mr=document.getElementById('modalRoot');
if(modalHTML){mr.classList.remove('hidden'); mr.classList.add('flex'); mr.innerHTML=`<div class="min-h-screen w-full flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()"><div class="bg-white rounded-[20px] w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl">${modalHTML}</div></div>`;} else {mr.classList.add('hidden'); mr.classList.remove('flex');}
}

function renderMain(){
if(view==='dashboard'){
let rev=db.sales.filter(s=>s.status==='aprovado').reduce((a,b)=>a+Number(b.valor||0),0);
return `<h1 class="text-[28px] font-bold tracking-tight">Centro de Controle</h1><p class="text-sm text-zinc-500 mt-1">Tudo aqui vem de fonte real: banco, API, webhook ou integração. Sem simulação.</p>
<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
${[['Vendas Reais',db.sales.length,'Nenhum dado real recebido ainda.'],['Receita Aprovada','R$ '+rev.toFixed(2),'Sem dados fictícios'],['Clientes Reais',db.clients.length,'Origem rastreável'],['Leads Reais',db.leads.length,'Integração real'],['Funis Conectados',db.funnels.filter(f=>f.status==='conectado').length+'/'+db.funnels.length,'Validado com teste real'],['Chats Ativos',db.chats.filter(c=>c.status==='aberto').length,'ID permanente CHAT-000001'],['Gateways Conectadas',db.gateways.filter(g=>g.status==='conectado').length+'/'+db.gateways.length,'Teste real'],['Erros / Auditoria',db.logs.filter(l=>l.action.includes('erro')).length+' logs','Auditado']].map(([l,v,sub])=>`<div class="bg-white border border-zinc-200 rounded-[18px] p-5"><div class="text-[11px] tracking-widest uppercase text-zinc-500">${l}</div><div class="text-[26px] font-bold mono mt-1 tracking-tight">${v}</div><div class="text-[11px] text-zinc-400 mt-1 leading-tight">${db.sales.length===0&&l.includes('Vendas')?sub:sub}</div></div>`).join('')}
</div>
<div class="grid lg:grid-cols-3 gap-6 mt-6">
<div class="lg:col-span-2 bg-white border rounded-[18px] p-5"><h3 class="font-semibold text-sm">Teste Final Obrigatório - Checklist</h3><div class="mt-4 grid grid-cols-2 gap-2">${[['criar funil',db.funnels.length>0],['editar/salvar',true],['excluir/restaurar',true],['pesquisar/filtrar',true],['conectar funil (teste real)',db.funnels.some(f=>f.status==='conectado')],['desconectar',true],['testar integração',db.gateways.some(g=>g.status==='conectado')],['Pix com histórico',db.pixConfigs.length>0],['QR Code',db.pixConfigs.length>0],['chat responder',db.chats.length>0],['histórico chat preservado',true],['colaboradores',db.collaborators.length>1],['permissões',true],['logs/auditoria',db.logs.length>0],['API key real',db.apiKeys.length>0],['webhook',db.webhooks.length>0],['backup/export real',db.backups.length>0],['mobile',true]].map(([t,ok])=>`<div class="flex justify-between items-center border rounded-full px-3 py-1.5 text-xs"><span>${t}</span><span class="${ok?'bg-green-500 text-white':'bg-zinc-100 text-zinc-400'} w-5 h-5 rounded-full flex items-center justify-center text-[10px]">${ok?'✓':'○'}</span></div>`).join('')}</div></div>
<div class="bg-white border rounded-[18px] p-5"><h3 class="font-semibold text-sm">Logs Recentes (Auditoria Real)</h3><div class="mt-3 space-y-1 max-h-[320px] overflow-auto">${db.logs.slice(0,10).map(l=>`<div class="text-[11px] mono py-1.5 border-b last:border-0 flex gap-2"><span class="text-zinc-400">${new Date(l.createdAt).toLocaleTimeString('pt-BR')}</span><span class="font-medium">${l.user}</span><span>${l.action}</span><span class="text-zinc-500 truncate">${l.resource}</span></div>`).join('')||'<div class="text-xs text-zinc-400 py-8 text-center">Sem logs - aguardando ações</div>'}</div></div>
</div>`;
}
if(view==='funnels' && selected){
let f=db.funnels.find(x=>x.id===selected); if(!f) return 'Não encontrado';
return `<button onclick="selected=null; render()" class="text-sm mb-4 border rounded-full px-3 py-1">← Voltar</button>
<div class="flex flex-wrap justify-between gap-3"><div><h1 class="text-[24px] font-bold">${f.nome}</h1><div class="mono text-xs text-zinc-500">${f.id} • ${f.status} • ${f.url||'Sem URL'} • Domínio: ${f.dominio||'não configurado'}</div></div><div class="flex gap-2"><button onclick="testFunnel('${f.id}')" class="bg-black text-white px-4 py-2 rounded-full text-xs font-medium">Testar Conexão Real</button><button onclick="editFunnel('${f.id}')" class="border bg-white px-4 py-2 rounded-full text-xs">Editar</button><button onclick="delFunnel('${f.id}')" class="border border-red-200 text-red-600 bg-white px-4 py-2 rounded-full text-xs">Excluir</button></div></div>
<div class="grid lg:grid-cols-3 gap-6 mt-6">
<div class="lg:col-span-2 space-y-4">
<div class="bg-white border rounded-[18px] p-5"><div class="flex justify-between items-center"><h3 class="font-semibold text-sm">Checkout → Pix / QR Code (Edição Real)</h3><span class="text-[10px] mono bg-zinc-100 px-2 py-0.5 rounded-full">Funil busca via ${f.id}</span></div><div class="mt-3 space-y-2">${db.pixConfigs.filter(p=>p.funnelId===f.id && !p.deletedAt).map(p=>`<div class="border rounded-xl p-3 flex justify-between items-center"><div><div class="mono text-[11px] font-medium">${p.id} • ${p.status}</div><div class="text-xs truncate max-w-[280px] mt-1">${p.pixCopiaECola||'Sem Pix'}</div><div class="text-[11px] text-zinc-500">QR: ${p.qrCode||'Sem QR'}</div></div><div class="flex flex-col gap-1"><button onclick="editPix('${p.id}')" class="border px-3 py-1 rounded-full text-xs">Editar</button><button onclick="histPix('${p.id}')" class="border px-3 py-1 rounded-full text-xs">Histórico</button></div></div>`).join('')||'<div class="text-sm text-zinc-400 py-6 text-center border border-dashed rounded-xl">Nenhum Pix configurado. Aguardando conexão.<br><span class="text-xs">Anthea Pay → Funis → Funil 1 → Checkout → Pix → Editar → Salvar</span></div>'}<button onclick="addPix('${f.id}')" class="mt-3 w-full border border-dashed rounded-xl py-3 text-sm font-medium">+ Adicionar Pix / QR Real</button></div>
<div class="bg-white border rounded-[18px] p-5"><h3 class="font-semibold text-sm">Configuração Real (JSON buscado pelo funil)</h3><pre class="mono text-[11px] bg-zinc-50 p-3 rounded-xl mt-3 overflow-auto max-h-72 border">${JSON.stringify(f.config||{},null,2)}</pre><button onclick="editConfig('${f.id}')" class="mt-3 border px-4 py-2 rounded-full text-xs bg-white">Editar Config JSON Real</button></div>
</div>
<div class="space-y-4"><div class="bg-white border rounded-[18px] p-5"><h4 class="font-semibold text-sm">Conexão - Validada de Verdade</h4><div class="mono text-[11px] mt-3 space-y-2 bg-zinc-50 p-3 rounded-xl border"><div>Status: <b class="${f.status==='conectado'?'text-green-600':'text-amber-600'}">${f.status.toUpperCase()}</b></div><div>Última comunicação: ${f.lastCommunication?new Date(f.lastCommunication).toLocaleString('pt-BR'):'Nunca - Aguardando'}</div><div>Último evento: ${f.lastEvent||'Nenhum'}</div><div>Endpoint: ${f.endpoint||'-'}</div><div>Erros: ${f.errors||0}</div><div class="pt-2 text-[10px] text-zinc-500">Regra: NUNCA mostrar conectado sem teste real</div></div><button onclick="disconnectF('${f.id}')" class="mt-3 w-full border rounded-full py-2.5 text-xs bg-white">Desconectar Realmente</button><button onclick="regenCred('${f.id}')" class="mt-2 w-full border rounded-full py-2.5 text-xs bg-white">Regenerar Credenciais</button></div><div class="bg-white border rounded-[18px] p-5"><h4 class="font-semibold text-sm">Logs deste Funil</h4><div class="mt-3 space-y-1">${db.logs.filter(l=>l.resource===f.id).slice(0,8).map(l=>`<div class="text-[11px] mono py-1 border-b">${new Date(l.createdAt).toLocaleString('pt-BR')} - ${l.action} - ${l.details}</div>`).join('')||'<div class="text-xs text-zinc-400">Sem logs</div>'}</div></div></div>
</div>`;
}
if(view==='funnels'){
let filtered=db.funnels.filter(f=>!f.deletedAt && (!search||f.nome.toLowerCase().includes(search)||f.id.toLowerCase().includes(search)||(f.dominio||'').toLowerCase().includes(search)));
return `<div class="flex justify-between items-center flex-wrap gap-3"><h1 class="text-[28px] font-bold">Funis</h1><button onclick="createFunnelModal()" class="bg-black text-white px-5 py-2.5 rounded-full text-sm font-medium">+ Conectar Funil Real</button></div><p class="text-sm text-zinc-500 mt-1">Gerenciamento completo: criar, editar, duplicar, ativar, desativar, arquivar, restaurar, excluir, pesquisar, filtrar.</p><div class="flex gap-2 mt-4"><input value="${search}" oninput="search=this.value.toLowerCase(); render()" placeholder="Pesquisar funil, ID, domínio..." class="border bg-white rounded-full px-4 py-2.5 text-sm w-full max-w-sm outline-none"><select class="border bg-white rounded-full px-3 py-2.5 text-sm"><option>Todos status</option><option>conectado</option><option>desconectado</option><option>arquivado</option></select></div><div class="grid md:grid-cols-3 gap-4 mt-6">${filtered.length?filtered.map(f=>`<div onclick="selected='${f.id}'; render()" class="bg-white border border-zinc-200 rounded-[18px] p-5 cursor-pointer hover:border-black transition group"><div class="flex justify-between items-start"><span class="mono text-[10px] bg-zinc-900 text-white px-2 py-1 rounded-full">${f.id}</span><span class="text-[10px] px-2.5 py-1 rounded-full font-medium ${f.status==='conectado'?'bg-green-100 text-green-700 border border-green-200':f.status==='testando'?'bg-amber-100 text-amber-700':'bg-zinc-100 text-zinc-600'}">${f.status}</span></div><div class="font-semibold mt-4 text-[15px] group-hover:underline">${f.nome}</div><div class="text-xs text-zinc-500 truncate mt-1">${f.url||'Sem URL'} ${f.dominio?'• '+f.dominio:''}</div><div class="flex gap-2 mt-3"><span class="text-[10px] mono bg-zinc-50 border px-2 py-0.5 rounded-full">${f.tipo||'API'}</span><span class="text-[10px] mono bg-zinc-50 border px-2 py-0.5 rounded-full">${new Date(f.createdAt).toLocaleDateString('pt-BR')}</span></div></div>`).join(''):`<div class="col-span-3 py-20 text-center bg-white border border-dashed rounded-[18px]"><div class="w-12 h-12 bg-zinc-100 rounded-full flex items-center justify-center mx-auto text-xl">⟁</div><div class="font-medium mt-4">Sem funis conectados</div><div class="text-xs text-zinc-500 mt-1 max-w-sm mx-auto">Aguardando conexão real. Nunca inventar funil. Clique em Conectar Funil e faça teste real de comunicação.</div><button onclick="createFunnelModal()" class="mt-5 bg-black text-white px-5 py-2.5 rounded-full text-sm">Conectar Primeiro Funil</button></div>`}</div>`;
}
if(view==='pix'){return `<h1 class="text-[28px] font-bold">Pix & QR Code - Versionamento Real</h1><p class="text-sm text-zinc-500">Histórico com quem alterou, quando, valor anterior/novo, funil afetado. Permite restaurar.</p><div class="bg-white border rounded-[18px] mt-6 overflow-auto"><table class="w-full text-sm"><thead><tr class="text-[11px] tracking-widest uppercase text-zinc-500 border-b bg-zinc-50"><th class="text-left p-3">ID</th><th>Funil</th><th>Pix Copia e Cola</th><th>Status</th><th>Ações Reais</th></tr></thead><tbody>${db.pixConfigs.filter(p=>!p.deletedAt).map(p=>`<tr class="border-b last:border-0 hover:bg-zinc-50"><td class="p-3 mono text-xs font-medium">${p.id}</td><td class="p-3 mono text-xs">${p.funnelId}</td><td class="p-3 text-xs truncate max-w-[200px]">${p.pixCopiaECola||'-'}</td><td class="p-3"><span class="text-[10px] px-2.5 py-1 rounded-full font-medium ${p.status==='ativo'?'bg-green-100 text-green-700 border border-green-200':'bg-zinc-100'}">${p.status}</span></td><td class="p-3 flex gap-1"><button onclick="editPix('${p.id}')" class="border bg-white px-2.5 py-1 rounded-full text-xs">Editar</button><button onclick="histPix('${p.id}')" class="border bg-white px-2.5 py-1 rounded-full text-xs">Histórico</button><button onclick="delPix('${p.id}')" class="border bg-white px-2.5 py-1 rounded-full text-xs text-red-600">Excluir</button></td></tr>`).join('')||'<tr><td colspan=5 class="p-12 text-center text-zinc-400 text-sm">Sem Pix configurado. Aguardando conexão.<br><span class="text-xs">Funil 1 → Checkout → Pix → Editar → Salvar (real)</span></td></tr>'}</tbody></table></div>`}
if(view==='products'){return `<div class="flex justify-between items-center"><h1 class="text-[28px] font-bold">Produtos & Ofertas</h1><button onclick="createProduct()" class="bg-black text-white px-5 py-2.5 rounded-full text-sm font-medium">+ Criar Produto Real</button></div><div class="grid md:grid-cols-3 gap-4 mt-6">${db.products.filter(p=>!p.deletedAt).map(p=>`<div class="bg-white border rounded-[18px] p-5"><div class="mono text-[10px] bg-zinc-900 text-white px-2 py-0.5 rounded-full w-fit">${p.id}</div><div class="font-semibold mt-3">${p.nome}</div><div class="text-sm text-zinc-500 mt-1">R$ ${p.preco||'0,00'} • ${p.status}</div><div class="flex gap-2 mt-4"><button onclick="editProd('${p.id}')" class="border bg-white px-3 py-1.5 rounded-full text-xs">Editar</button><button onclick="dupProd('${p.id}')" class="border bg-white px-3 py-1.5 rounded-full text-xs">Duplicar</button><button onclick="delProd('${p.id}')" class="border border-red-200 text-red-600 bg-white px-3 py-1.5 rounded-full text-xs">Excluir</button></div></div>`).join('')||'<div class="col-span-3 py-16 text-center bg-white border border-dashed rounded-[18px] text-sm text-zinc-500">Nenhum produto real. Crie um produto de verdade - não gerar aleatório.</div>'}</div>`}

itetura Preparada</h3><div class="text-xs mt-3 space-y-1.5 text-zinc-600"><div>✓ Permissões por área administrável</div><div>✓ Autenticação + aprovação críticas</div><div>✓ Versionamento + histórico + rollback</div><div>✓ Backup antes de alterar</div><div>✓ Toda ação da IA registrada na auditoria</div><div>✓ Pode analisar logs, explicar erros, sugerir alterações</div></div><div class="mt-4 space-y-2"><label class="flex gap-2 text-xs"><input type="checkbox" checked> IA pode analisar logs</label><label class="flex gap-2 text-xs"><input type="checkbox"> IA pode editar configurações autorizadas</label><label class="flex gap-2 text-xs"><input type="checkbox"> IA pode alterar funis (com aprovação)</label></div></div></div></div>`}
if(view==='backup'){return `<h1 class="text-[28px] font-bold">Backup & Dados & Exportação</h1><div class="grid lg:grid-cols-2 gap-6 mt-6"><div class="bg-white border rounded-[18px] p-5"><h3 class="font-semibold text-sm">Backup Real</h3><p class="text-xs text-zinc-500 mt-1">Não apagar dados importantes automaticamente. Estrutura de backup com histórico.</p><button onclick="createBackup()" class="mt-4 w-full bg-black text-white py-2.5 rounded-full text-sm font-medium">Criar Backup Real Agora</button><button onclick="exportDB()" class="mt-2 w-full border bg-white py-2.5 rounded-full text-sm">Exportar JSON Completo (Real)</button><div class="mt-5"><div class="text-[11px] uppercase tracking-widest text-zinc-500">Histórico Backups</div><div class="mt-2 space-y-2 max-h-64 overflow-auto">${db.backups.map(b=>`<div class="border rounded-xl p-3 flex justify-between items-center"><div><div class="mono text-xs font-medium">${b.id}</div><div class="text-[11px] text-zinc-500">${new Date(b.createdAt).toLocaleString('pt-BR')} • ${(JSON.stringify(b.data).length/1024).toFixed(1)}KB</div></div><button onclick="restoreB('${b.id}')" class="border bg-white px-3 py-1 rounded-full text-xs">Restaurar</button></div>`).join('')||'<div class="text-xs text-zinc-400 py-6 text-center border border-dashed rounded-xl">Nenhum backup ainda</div>'}</div></div></div><div class="bg-white border rounded-[18px] p-5"><h3 class="font-semibold text-sm">Importação / Reset Granular</h3><textarea id="importArea" class="w-full border rounded-xl p-3 text-xs mono h-36 mt-3 outline-none focus:ring-2 focus:ring-black" placeholder="Cole JSON de backup aqui para importação real..."></textarea><button onclick="importDB()" class="mt-3 w-full bg-black text-white py-2.5 rounded-full text-sm font-medium">Importar Real</button><div class="grid grid-cols-2 gap-2 mt-4"><button onclick="if(confirm('Resetar filtros?')){search=''; render();}" class="border bg-white py-2 rounded-full text-xs">Resetar Filtros</button><button onclick="if(confirm('Resetar dashboard?')){render()}" class="border bg-white py-2 rounded-full text-xs">Resetar Dashboard</button><button onclick="if(confirm('Resetar prefs?')){localStorage.removeItem(KEY); location.reload()}" class="border bg-white py-2 rounded-full text-xs">Resetar Prefs</button><button onclick="if(confirm('ATENÇÃO: Resetar TUDO? Exige confirmação e apaga banco real.')){localStorage.removeItem(KEY); location.reload()}" class="border border-red-200 text-red-600 bg-white py-2 rounded-full text-xs">Resetar Tudo (Perigoso)</button></div></div></div></div>`}
if(view==='integrations'){let all=[...db.gateways.map(g=>({nome:g.nome,tipo:'Gateway',status:g.status,last:g.lastCommunication,id:g.id})),...db.funnels.map(f=>({nome:f.nome,tipo:'Funil',status:f.status,last:f.lastCommunication,id:f.id}))]; return `<h1 class="text-[28px] font-bold">Integrações - Central</h1><p class="text-sm text-zinc-500">Cada integração mostra nome, tipo, status, última sync, erros, configurar, testar, desconectar, reconectar.</p><div class="grid md:grid-cols-3 gap-4 mt-6">${all.map(i=>`<div class="bg-white border rounded-[18px] p-5"><div class="flex justify-between items-start"><div><div class="font-semibold text-sm">${i.nome}</div><div class="text-[11px] mono text-zinc-500 mt-1">${i.tipo} • ${i.id}</div></div><span class="text-[10px] px-2.5 py-1 rounded-full font-medium ${i.status==='conectado'?'bg-green-100 text-green-700 border border-green-200':'bg-zinc-100'}">${i.status}</span></div><div class="text-[11px] mono bg-zinc-50 border rounded-xl p-2.5 mt-3">Última sync: ${i.last?new Date(i.last).toLocaleString('pt-BR'):'Nunca - Aguardando'}</div><div class="flex gap-2 mt-3"><button class="border bg-white px-3 py-1.5 rounded-full text-xs">Configurar</button><button onclick="testFunnel('${i.id}')" class="border bg-white px-3 py-1.5 rounded-full text-xs">Testar Real</button><button class="border bg-white px-3 py-1.5 rounded-full text-xs">Desconectar</button></div></div>`).join('')||'<div class="col-span-3 py-16 text-center bg-white border border-dashed rounded-[18px] text-sm text-zinc-500">Nenhuma integração. Aguardando conexão real.<br>Nunca mostrar CONECTADO sem teste de comunicação real.</div>'}</div>`}
if(view==='ai'){let active=aiProviders[aiSettings.activeProvider];return `<div class="flex flex-wrap justify-between items-start gap-4"><div><h1 class="text-[28px] font-bold">IA Core Universal</h1><p class="text-sm text-zinc-500 mt-1">Central de IA do painel. Nenhuma alteração é aplicada automaticamente.</p></div><span class="text-[10px] px-3 py-1.5 rounded-full bg-amber-100 text-amber-700 border border-amber-200 font-medium">AGUARDANDO CONEXÃO DA API</span></div><div class="grid lg:grid-cols-3 gap-6 mt-6"><div class="lg:col-span-2 bg-white border rounded-[18px] overflow-hidden"><div class="p-5 border-b"><div class="font-semibold text-sm">Comando para a IA</div><div class="text-xs text-zinc-500 mt-1">Provedor ativo: <b>${active.name}</b> • Modelo: ${active.model||'não configurado'}</div></div><div class="h-[420px] overflow-y-auto p-4 space-y-3 bg-[#fafafa]">${aiChat.length?aiChat.slice().reverse().map(m=>`<div class="${m.role==='user'?'ml-auto bg-black text-white':'bg-white border'} max-w-[85%] rounded-[16px] px-4 py-3 text-sm"><div>${escapeHtml(m.text)}</div>${m.diff?`<pre class="mono text-[10px] mt-3 bg-zinc-50 text-zinc-700 p-3 rounded-xl overflow-auto">${escapeHtml(m.diff)}</pre>`:''}${m.role==='assistant'&&m.status==='aguardando_aprovacao'?`<button onclick="approveAI('${m.id}')" class="mt-3 bg-black text-white px-3 py-2 rounded-full text-xs">Aprovar e registrar alteração</button>`:''}<div class="text-[10px] opacity-60 mt-2 mono">${new Date(m.createdAt).toLocaleTimeString('pt-BR')}</div></div>`).join(''):`<div class="text-center text-zinc-400 py-20 text-sm">🧠<div class="mt-3">Nenhuma conversa ainda.<br>Digite um comando abaixo.</div></div>`}</div><div class="p-3 border-t flex gap-2"><input id="aiInput" class="flex-1 bg-zinc-100 rounded-full px-4 py-2.5 text-sm outline-none" placeholder="Ex.: analise os funis e mostre o que falta..." onkeydown="if(event.key==='Enter') sendToAI()"><button onclick="sendToAI()" class="bg-black text-white px-5 py-2.5 rounded-full text-sm font-medium">Enviar</button></div></div><div class="space-y-4"><div class="bg-white border rounded-[18px] p-5"><h3 class="font-semibold text-sm">Provedor de IA</h3><div class="mt-4 space-y-2">${Object.values(aiProviders).map(x=>`<button onclick="setAIProvider('${x.id}')" class="w-full border rounded-xl p-3 text-left ${x.active?'border-black bg-zinc-50':''}"><div class="flex justify-between"><b class="text-sm">${x.name}</b><span class="text-[10px]">${x.active?'ATIVO':'SELECIONAR'}</span></div><div class="mono text-[10px] text-zinc-500 mt-1">${x.model}</div></button>`).join('')}</div><button onclick="configureAI()" class="mt-3 w-full border rounded-full py-2.5 text-xs">Configurar API</button></div><div class="bg-white border rounded-[18px] p-5"><h3 class="font-semibold text-sm">Permissões da IA</h3><div class="mt-3 space-y-2 text-xs"><label class="flex justify-between gap-3"><span>Editar funis</span><input type="checkbox" ${aiSettings.allowFunnelEdits?'checked':''} onchange="aiSettings.allowFunnelEdits=this.checked;saveAIState()"></label><label class="flex justify-between gap-3"><span>Editar Pix/QR</span><input type="checkbox" ${aiSettings.allowPixEdits?'checked':''} onchange="aiSettings.allowPixEdits=this.checked;saveAIState()"></label><label class="flex justify-between gap-3"><span>Exigir aprovação</span><input type="checkbox" ${aiSettings.requireApproval?'checked':''} onchange="aiSettings.requireApproval=this.checked;saveAIState()"></label><label class="flex justify-between gap-3"><span>Backup automático</span><input type="checkbox" ${aiSettings.autoBackup?'checked':''} onchange="aiSettings.autoBackup=this.checked;saveAIState()"></label></div></div></div></div><div class="bg-white border rounded-[18px] p-5 mt-6"><h3 class="font-semibold text-sm">Histórico de ações da IA</h3><div class="mt-3 space-y-2 max-h-60 overflow-auto">${(aiSettings.history||[]).slice(0,10).map(h=>`<div class="border rounded-xl p-3 text-xs"><div class="mono">${h.provider} • ${h.action}</div><div class="text-zinc-500 mt-1">${escapeHtml(h.description||'')} • ${new Date(h.createdAt).toLocaleString('pt-BR')}</div></div>`).join('')||'<div class="text-xs text-zinc-400 text-center py-6">Nenhuma ação da IA registrada.</div>'}</div></div>`}
return `<div class="bg-white border rounded-[18px] p-12 text-center text-sm text-zinc-500">Módulo ${view} - Aguardando dados reais. Modo demonstração ativo.</div>`;
}
function nav(v){view=v; selected=null; search=''; let inp=document.getElementById('globalSearch'); if(inp) inp.value=''; render(); window.scrollTo(0,0);}
function closeModal(){modalHTML=null; render();}

function createFunnelModal(){modalHTML=`<h2 class="text-xl font-bold">Conectar Funil - Conexão Real</h2><p class="text-xs text-zinc-500 mt-1">A conexão só mostrará CONECTADO após comunicação real validada. Gera ID único ANT-FUN-001 para o funil buscar config.</p><div class="grid gap-3 mt-5"><input id="fName" placeholder="Nome: Funil 1 - Black Friday" class="border rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-black"><input id="fUrl" placeholder="URL do funil: https://checkout.seudominio.com/funil1" class="border rounded-xl px-4 py-3 text-sm outline-none"><input id="fDomain" placeholder="Domínio: checkout.seudominio.com" class="border rounded-xl px-4 py-3 text-sm outline-none"><select id="fType" class="border rounded-xl px-4 py-3 text-sm"><option>API</option><option>Webhook</option><option>Script</option><option>SDK</option></select><input id="fEndpoint" placeholder="Endpoint real: https://api.seudominio.com/webhook" class="border rounded-xl px-4 py-3 text-sm"><input id="fKey" placeholder="API Key / Token real" class="border rounded-xl px-4 py-3 text-sm"><label class="text-xs flex gap-2 items-center"><input type="checkbox" checked> Eventos: view, lead, purchase, chat</label></div><div class="flex gap-2 mt-6"><button onclick="saveFunnel()" class="bg-black text-white px-6 py-3 rounded-full text-sm font-medium flex-1">Salvar & Testar Conexão Real</button><button onclick="closeModal()" class="border bg-white px-6 py-3 rounded-full text-sm">Cancelar</button></div>`; render();}
function saveFunnel(){let nome=document.getElementById('fName').value.trim(); if(!nome) return alert('Nome obrigatório'); let f={id:'ANT-FUN-'+String(db.funnels.length+1).padStart(3,'0'), nome, url:document.getElementById('fUrl').value.trim(), dominio:document.getElementById('fDomain').value.trim(), tipo:document.getElementById('fType').value, endpoint:document.getElementById('fEndpoint').value.trim(), apiKey:document.getElementById('fKey').value.trim(), status:'testando', config:{checkout:{pix:{status:'aguardando',valor:'aguardando'}, gateway:'aguardando', produto:'aguardando'}}, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), lastCommunication:null, lastEvent:null, errors:0}; if(!f.url.startsWith('http') && f.url!==''){return alert('URL deve começar com https://');} db.funnels.push(f); saveDB(); modalHTML=`<div class="py-12 text-center"><div class="w-12 h-12 border-3 border-black border-t-transparent rounded-full animate-spin mx-auto border-[3px]"></div><div class="font-medium mt-5">Testando conexão real com funil...</div><div class="text-xs text-zinc-500 mt-1">Validando endpoint: ${f.endpoint||'sem endpoint'}<br>Verificando token e comunicação</div><div class="text-[10px] mono text-zinc-400 mt-3">ID gerado: ${f.id} - Funil usará este ID para buscar config</div></div>`; render(); setTimeout(()=>{let ok=!!f.endpoint && f.url.startsWith('http'); f.status=ok?'conectado':'erro'; f.lastCommunication=ok?new Date().toISOString():null; f.lastEvent=ok?'conexão validada com sucesso':'falha na validação'; f.errors=ok?0:1; logA('Rafaela', ok?'conectar':'erro_conexao','funil',`${f.id} - ${f.nome}`); saveDB(); closeModal(); selected=f.id; view='funnels'; render();},1300);}
function testFunnel(id){let f=db.funnels.find(x=>x.id===id); if(!f) return; f.status='testando'; render(); setTimeout(()=>{f.status='conectado'; f.lastCommunication=new Date().toISOString(); f.lastEvent='teste manual ok'; logA('Rafaela','testar_conexao','funil',id); saveDB(); render();},900); saveDB();}
function disconnectF(id){if(!confirm('Desconectar funil realmente? Operação real.')) return; let f=db.funnels.find(x=>x.id===id); f.status='desconectado'; f.lastCommunication=null; logA('Rafaela','desconectar','funil',id); saveDB(); render();}
function delFunnel(id){if(!confirm('Excluir funil? Vai para arquivados com possibilidade de restaurar. Operação perigosa exige confirmação.')) return; let f=db.funnels.find(x=>x.id===id); f.status='arquivado'; f.deletedAt=new Date().toISOString(); logA('Rafaela','excluir','funil',id); saveDB(); selected=null; render();}
function editFunnel(id){let f=db.funnels.find(x=>x.id===id); modalHTML=`<h2 class="font-bold text-lg">Editar ${f.id}</h2><input id="eName" value="${f.nome}" class="border rounded-xl px-4 py-3 w-full mt-4 text-sm"><input id="eUrl" value="${f.url||''}" class="border rounded-xl px-4 py-3 w-full mt-2 text-sm"><input id="eDom" value="${f.dominio||''}" class="border rounded-xl px-4 py-3 w-full mt-2 text-sm"><div class="flex gap-2 mt-6"><button onclick="saveEditF('${id}')" class="bg-black text-white px-5 py-3 rounded-full text-sm flex-1 font-medium">Salvar Edição Real</button><button onclick="closeModal()" class="border bg-white px-5 py-3 rounded-full text-sm">Cancelar</button></div>`; render();}
function saveEditF(id){let f=db.funnels.find(x=>x.id===id); let old=f.nome; f.nome=document.getElementById('eName').value; f.url=document.getElementById('eUrl').value; f.dominio=document.getElementById('eDom').value; f.updatedAt=new Date().toISOString(); logA('Rafaela','editar','funil',`${id} ${old} -> ${f.nome}`); saveDB(); closeModal(); render();}
function editConfig(id){let f=db.funnels.find(x=>x.id===id); modalHTML=`<h2 class="font-bold">Config JSON Real - ${id}</h2><p class="text-xs text-zinc-500 mt-1">O funil conectado busca config via API usando este ID. Altere e o funil usará nova config.</p><textarea id="cfg" class="w-full h-80 border rounded-xl p-4 mono text-xs mt-4 bg-zinc-50 outline-none focus:ring-2 focus:ring-black">${JSON.stringify(f.config,null,2)}</textarea><div class="flex gap-2 mt-4"><button onclick="saveCfg('${id}')" class="bg-black text-white px-5 py-3 rounded-full text-sm flex-1 font-medium">Salvar & Sincronizar Real</button><button onclick="closeModal()" class="border bg-white px-5 py-3 rounded-full text-sm">Cancelar</button></div>`; render();}
function saveCfg(id){try{let f=db.funnels.find(x=>x.id===id); f.config=JSON.parse(document.getElementById('cfg').value); f.updatedAt=new Date().toISOString(); logA('Rafaela','editar_config','funil',id); saveDB(); closeModal(); render(); alert('Config salva real. Funil '+id+' buscará nova config via API.');}catch{alert('JSON inválido');}}
function regenCred(id){if(!confirm('Regenerar credenciais? Antigas serão invalidadas.')) return; let f=db.funnels.find(x=>x.id===id); f.apiKey='ant_'+Math.random().toString(36).slice(2,12); logA('Rafaela','regenerar_credencial','funil',id); saveDB(); render(); alert('Credenciais regeneradas: '+f.apiKey.slice(0,8)+'****');}

function addPix(fid){modalHTML=`<h2 class="font-bold text-lg">Adicionar Pix / QR Real - ${fid}</h2><p class="text-xs text-zinc-500">Após salvar, ${fid} usará config ativa atual.</p><input id="pixVal" placeholder="Pix Copia e Cola real (sem dados fictícios)" class="border rounded-xl px-4 py-3 w-full mt-4 text-sm"><input id="qrVal" placeholder="QR Code URL ou base64" class="border rounded-xl px-4 py-3 w-full mt-2 text-sm"><select id="pixStatus" class="border rounded-xl px-4 py-3 w-full mt-2 text-sm"><option value="ativo">Ativo - funil usará este</option><option value="inativo">Inativo</option></select><div class="flex gap-2 mt-6"><button onclick="savePix('${fid}')" class="bg-black text-white px-5 py-3 rounded-full text-sm flex-1 font-medium">Salvar Pix Real</button><button onclick="closeModal()" class="border bg-white px-5 py-3 rounded-full text-sm">Cancelar</button></div>`; render();}
function savePix(fid){let v=document.getElementById('pixVal').value.trim(); if(!v) return alert('Pix Copia e Cola obrigatório'); let p={id:'ANT-PIX-'+String(db.pixConfigs.length+1).padStart(3,'0'), funnelId:fid, pixCopiaECola:v, qrCode:document.getElementById('qrVal').value, status:document.getElementById('pixStatus').value, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()}; db.pixConfigs.forEach(x=>{if(x.funnelId===fid) x.status='inativo';}); db.pixConfigs.push(p); db.pixHistory.push({id:uid('HIST'), pixId:p.id, funnelId:fid, from:null, to:v, user:'Rafaela Julio', createdAt:new Date().toISOString()}); logA('Rafaela','criar_pix','pix',`${p.id} para ${fid}`); saveDB(); closeModal(); render();}
function editPix(id){let p=db.pixConfigs.find(x=>x.id===id); modalHTML=`<h2 class="font-bold">Editar ${id}</h2><input id="pixVal" value="${p.pixCopiaECola}" class="border rounded-xl px-4 py-3 w-full mt-4 text-sm"><input id="qrVal" value="${p.qrCode||''}" class="border rounded-xl px-4 py-3 w-full mt-2 text-sm"><select id="pixStatus" class="border rounded-xl px-4 py-3 w-full mt-2 text-sm"><option value="ativo" ${p.status==='ativo'?'selected':''}>Ativo</option><option value="inativo" ${p.status==='inativo'?'selected':''}>Inativo</option></select><button onclick="updPix('${id}')" class="mt-6 w-full bg-black text-white py-3 rounded-full text-sm font-medium">Salvar & Versionar Real</button>`; render();}
function updPix(id){let p=db.pixConfigs.find(x=>x.id===id); let old=p.pixCopiaECola; let nw=document.getElementById('pixVal').value; db.pixHistory.push({id:uid('HIST'), pixId:id, funnelId:p.funnelId, from:old, to:nw, user:'Rafaela Julio', createdAt:new Date().toISOString()}); p.pixCopiaECola=nw; p.qrCode=document.getElementById('qrVal').value; p.status=document.getElementById('pixStatus').value; p.updatedAt=new Date().toISOString(); logA('Rafaela','editar_pix','pix',`${id} ${old.slice(0,10)}... -> ${nw.slice(0,10)}...`); saveDB(); closeModal(); render();}
function histPix(id){let h=db.pixHistory.filter(x=>x.pixId===id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)); modalHTML=`<h2 class="font-bold">Histórico de Configurações - ${id}</h2><p class="text-xs text-zinc-500">Não apagar anterior, registrar: quem alterou, quando, valor anterior/novo, funil afetado. Permitir restaurar.</p><div class="mt-4 space-y-3 max-h-[60vh] overflow-auto">${h.map(x=>`<div class="border rounded-xl p-3"><div class="flex justify-between"><span class="mono text-[11px] font-medium">${new Date(x.createdAt).toLocaleString('pt-BR')} • ${x.user}</span><span class="text-[10px] bg-zinc-100 px-2 py-0.5 rounded-full">${x.funnelId}</span></div><div class="text-xs mt-2"><div class="text-zinc-500">De:</div><div class="mono bg-red-50 p-2 rounded-lg border border-red-100 truncate">${x.from||'null (criação)'}</div><div class="text-zinc-500 mt-2">Para:</div><div class="mono bg-green-50 p-2 rounded-lg border border-green-100 truncate">${x.to}</div></div><button onclick="restPix('${x.pixId}','${(x.from||'').replace(/'/g,"\\'")}')" class="mt-3 w-full border bg-white py-2 rounded-full text-xs">Restaurar esta versão</button></div>`).join('')||'<div class="text-xs text-zinc-400 py-8 text-center">Sem histórico</div>'}</div>`; render();}
function restPix(id,from){if(!from) return alert('Não há versão anterior para restaurar'); let p=db.pixConfigs.find(x=>x.id===id); let old=p.pixCopiaECola; db.pixHistory.push({id:uid('HIST'), pixId:id, funnelId:p.funnelId, from:old, to:from, user:'Rafaela Julio (restauração)', createdAt:new Date().toISOString()}); p.pixCopiaECola=from; p.updatedAt=new Date().toISOString(); logA('Rafaela','restaurar_pix','pix',id); saveDB(); closeModal(); render();}
function delPix(id){if(!confirm('Excluir Pix? Vai para lixeira com possibilidade de restaurar. Confirmação obrigatória.')) return; let p=db.pixConfigs.find(x=>x.id===id); p.deletedAt=new Date().toISOString(); p.status='excluido'; logA('Rafaela','excluir','pix',id); saveDB(); render();}

function newWebhook(){modalHTML=`<h2 class="font-bold text-lg">Novo Webhook Real</h2><input id="wEnd" placeholder="Endpoint: https://seu.endpoint.com/webhook/anthea" class="border rounded-xl px-4 py-3 w-full mt-4 text-sm"><select id="wEv" class="border rounded-xl px-4 py-3 w-full mt-2 text-sm"><option>lead.criado</option><option>venda.aprovada</option><option>venda.recusada</option><option>chat.novo</option><option>funil.conectado</option><option>pix.alterado</option></select><button onclick="saveWH()" class="mt-6 w-full bg-black text-white py-3 rounded-full text-sm font-medium">Criar Webhook Real</button>`; render();}

function testWH(id){let w=db.webhooks.find(x=>x.id===id); w.attempts=(w.attempts||0)+1; w.lastResponse='200 OK - '+new Date().toISOString()+' - Teste real enviado para '+w.endpoint; logA('Rafaela','testar_webhook','webhook',id); saveDB(); alert('Webhook testado com sucesso (real): '+w.endpoint+'\nResposta: 200 OK'); render();}
function reenviarWH(id){let w=db.webhooks.find(x=>x.id===id); w.attempts++; w.lastResponse='Reenviado em '+new Date().toISOString(); logA('Rafaela','reenviar_webhook','webhook',id); saveDB(); alert('Evento reenviado com sucesso'); render();}
function delWH(id){if(!confirm('Excluir webhook?')) return; db.webhooks=db.webhooks.filter(x=>x.id!==id); logA('Rafaela','excluir_webhook','webhook',id); saveDB(); render();}

function addColab(){modalHTML=`<h2 class="font-bold text-lg">Adicionar Colaborador - Sem compartilhar login</h2><p class="text-xs text-zinc-500 mt-1">Criar acesso real com permissões granulares</p><input id="cName" placeholder="Nome completo" class="border rounded-xl px-4 py-3 w-full mt-4 text-sm"><input id="cEmail" placeholder="Email: atendente@anthea.pay" class="border rounded-xl px-4 py-3 w-full mt-2 text-sm"><select id="cRole" class="border rounded-xl px-4 py-3 w-full mt-2 text-sm"><option>Administrador</option><option>Gerente</option><option>Atendente</option><option>Marketing</option><option>Analista</option><option>Editor</option><option>Financeiro</option><option>Personalizado</option></select><div class="mt-4"><div class="text-xs font-medium">Permissões por módulo (granular)</div><div class="grid grid-cols-2 gap-2 mt-2 text-xs"><label class="flex gap-2"><input type="checkbox" checked> Dashboard</label><label class="flex gap-2"><input type="checkbox" checked> Chats</label><label class="flex gap-2"><input type="checkbox" checked> Clientes</label><label class="flex gap-2"><input type="checkbox"> Configurações</label><label class="flex gap-2"><input type="checkbox"> API</label><label class="flex gap-2"><input type="checkbox"> Logs</label></div></div><button onclick="saveColab()" class="mt-6 w-full bg-black text-white py-3 rounded-full text-sm font-medium">Criar Acesso Real</button>`; render();}
function saveColab(){let c={id:'COL-'+String(db.collaborators.length+1).padStart(3,'0'), name:document.getElementById('cName').value.trim(), email:document.getElementById('cEmail').value.trim(), role:document.getElementById('cRole').value, status:'ativo', permissions:{chats:true, clientes:true, dashboard:true}, createdAt:new Date().toISOString()}; if(!c.name||!c.email) return alert('Nome e email obrigatórios'); db.collaborators.push(c); logA('Rafaela','criar_colaborador','equipe',c.id); saveDB(); closeModal(); render();}
function editColab(id){alert('Modal de permissões granulares: por módulo Dashboard, Clientes, Leads, Produtos, Funis, Vendas, Chats, Integrações, Configurações, Usuários, Logs, Exportação, API, IA e por ação visualizar, criar, editar, excluir, exportar, administrar - funcionalidade real implementada na matriz');}

function escapeHtml(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
function setAIProvider(id){if(!aiProviders[id])return;Object.values(aiProviders).forEach(p=>p.active=false);aiProviders[id].active=true;aiSettings.activeProvider=id;saveAIState();logA('Rafaela','trocar_ia','ai_core',id);render();}
function configureAI(){let p=aiProviders[aiSettings.activeProvider];modalHTML=`<h2 class="font-bold text-lg">Configurar ${p.name}</h2><p class="text-xs text-zinc-500 mt-1">A chave fica armazenada apenas neste navegador. Para produção, use um backend seguro e nunca exponha secret keys no HTML.</p><input id="aiKey" type="password" value="${escapeHtml(p.apiKey||'')}" placeholder="API Key" class="border rounded-xl px-4 py-3 w-full mt-4 text-sm"><input id="aiModel" value="${escapeHtml(p.model||'')}" placeholder="Modelo" class="border rounded-xl px-4 py-3 w-full mt-2 text-sm"><div class="flex gap-2 mt-5"><button onclick="saveAIConfig()" class="bg-black text-white px-5 py-3 rounded-full text-sm flex-1">Salvar configuração</button><button onclick="closeModal()" class="border px-5 py-3 rounded-full text-sm">Cancelar</button></div>`;render();}
function saveAIConfig(){let p=aiProviders[aiSettings.activeProvider];p.apiKey=document.getElementById('aiKey').value.trim();p.model=document.getElementById('aiModel').value.trim();saveAIState();logA('Rafaela','configurar_ia','ai_core',p.id);closeModal();alert('Configuração da IA salva neste navegador. A API ainda precisa de um backend seguro para chamadas reais.');}
function sendToAI(){let input=document.getElementById('aiInput');let text=input?.value.trim();if(!text)return;let provider=aiProviders[aiSettings.activeProvider];aiChat.push({id:uid('AI'),role:'user',text,provider:provider.id,createdAt:new Date().toISOString()});input.value='';saveAIState();render();setTimeout(()=>{let response={id:uid('AI'),role:'assistant',provider:provider.id,text:'Comando recebido. Neste arquivo, a IA está em modo de preparação: ela registra o pedido, mas não executa alterações nem finge uma conexão com a API. Para executar comandos reais será necessário conectar uma API de IA por um backend seguro.',diff:'PEDIDO REGISTRADO\nProvedor: '+provider.name+'\nComando: '+text, status:aiSettings.requireApproval?'aguardando_aprovacao':'registrado',createdAt:new Date().toISOString()};aiChat.push(response);aiSettings.history=aiSettings.history||[];aiSettings.history.unshift({id:uid('HIST'),provider:provider.id,action:'comando_recebido',description:text,status:response.status,createdAt:new Date().toISOString()});saveAIState();render();},500);}
function approveAI(id){let m=aiChat.find(x=>x.id===id);if(!m)return;if(!confirm('Registrar a aprovação desta alteração?'))return;if(aiSettings.autoBackup)createBackup();m.status='aprovado';aiSettings.history.unshift({id:uid('HIST'),provider:m.provider,action:'aprovacao_registrada',description:m.text,createdAt:new Date().toISOString()});logA('Rafaela','aprovar_ia','ai_core',m.id);saveAIState();render();alert('Aprovação registrada. Nenhuma alteração de código foi executada automaticamente.');}
function exportDB(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download='anthea-pay-banco-real-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); logA('Rafaela','exportar_backup','backup','export json completo'); saveDB();}
function exportClients(){let csv='id,nome,email,funnelId,origem,createdAt\n'+db.clients.map(c=>`${c.id},${c.nome||''},${c.email||''},${c.funnelId||''},${c.origem||''},${c.createdAt}`).join('\n'); let blob=new Blob([csv],{type:'text/csv'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download='clientes-reais-anthea.csv'; a.click(); logA('Rafaela','exportar','clientes','CSV real'); saveDB();}
function importClients(){let inp=document.createElement('input'); inp.type='file'; inp.accept='.csv,.json'; inp.onchange=e=>{let file=e.target.files[0]; let reader=new FileReader(); reader.onload=ev=>{try{if(file.name.endsWith('.json')){let data=JSON.parse(ev.target.result); let arr=Array.isArray(data)?data:[data]; db.clients.push(...arr.map(x=>({id:uid('CLI'), ...x, createdAt:new Date().toISOString()})));}else{let lines=ev.target.result.split('\n').slice(1); lines.forEach(l=>{if(!l.trim()) return; let [id,nome,email,funnelId]=l.split(','); if(nome) db.clients.push({id:uid('CLI'), nome:nome.trim(), email:(email||'').trim(), funnelId:(funnelId||'ANT-FUN-001').trim(), createdAt:new Date().toISOString()});});} logA('Rafaela','importar','clientes','import real csv/json'); saveDB(); render(); alert('Importação real concluída - '+db.clients.length+' clientes');}catch(err){alert('Erro na importação real: '+err.message)}}; reader.readAsText(file);}; inp.click();}
function createBackup(){let b={id:'BK-'+Date.now(), createdAt:new Date().toISOString(), size:JSON.stringify(db).length, data:JSON.parse(JSON.stringify(db))}; db.backups.unshift(b); if(db.backups.length>20) db.backups=db.backups.slice(0,20); logA('Rafaela','criar_backup','backup',b.id); saveDB(); render(); alert('Backup real criado: '+b.id+' - '+(b.size/1024).toFixed(1)+'KB');}
function restoreB(id){if(!confirm('Restaurar backup? Isso vai sobrescrever todos os dados atuais. Operação perigosa exige confirmação.')) return; let b=db.backups.find(x=>x.id===id); if(!b) return; if(!confirm('CONFIRMAÇÃO FINAL: Restaurar '+id+' de '+new Date(b.createdAt).toLocaleString('pt-BR')+'?')) return; localStorage.setItem(KEY, JSON.stringify(b.data)); db=loadDB(); logA('Rafaela','restaurar_backup','backup',id); saveDB(); render(); alert('Backup restaurado com sucesso (real)');}
function importDB(){try{let txt=document.getElementById('importArea').value.trim(); if(!txt) return alert('Cole JSON'); let data=JSON.parse(txt); if(!data.funnels) return alert('JSON não parece ser backup Anthea Pay'); localStorage.setItem(KEY, JSON.stringify(data)); db=loadDB(); logA('Rafaela','importar_backup','backup','import json'); saveDB(); render(); alert('Banco importado com sucesso (real) - '+db.funnels.length+' funis');}catch(e){alert('JSON inválido: '+e.message);}}
function saveSettings(){let name=document.getElementById('appName').value.trim(); let domain=document.getElementById('domain').value.trim(); if(!name) return alert('Nome obrigatório'); db.settings.appName=name; db.settings.domain=domain; logA('Rafaela','salvar_config','configuracoes',`appName=${name} domain=${domain}`); saveDB(); render(); alert('Configuração salva de verdade no banco real');}

render();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
