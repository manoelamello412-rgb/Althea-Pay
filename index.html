<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08070d"><title>ALTHEA PAY — Control Center</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#07070a;--p:#111116;--p2:#17171e;--line:#292934;--txt:#f8f8fb;--muted:#9b9ba8;--a:#8b5cf6;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#2a1647,transparent 34%),var(--bg);color:var(--txt);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{border-right:1px solid var(--line);background:#0b0b10;padding:18px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center}.mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#6d28d9,#a78bfa);font-weight:900;box-shadow:0 12px 35px #7c3aed44}.brand b{letter-spacing:.08em}.brand small{display:block;color:var(--muted);margin-top:2px}.nav{margin-top:26px;display:grid;gap:4px}.nav button,.mobile button{border:0;background:none;color:var(--muted);padding:10px 11px;border-radius:10px;text-align:left}.nav button:hover,.nav button.active,.mobile button.active{background:#1c1727;color:#fff}.logout{position:absolute;left:18px;right:18px;bottom:18px}.main{padding:28px;max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:27px}.top p{color:var(--muted);margin:5px 0}.user{color:var(--muted)}.section{display:none}.section.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:linear-gradient(180deg,#121217,#101014);border:1px solid var(--line);border-radius:16px;padding:17px}.label{color:var(--muted);font-size:12px}.value{font-size:25px;font-weight:800;margin-top:7px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.toolbar h2{margin:0}.primary,.secondary,.danger{border-radius:10px;padding:10px 14px;font-weight:700}.primary{border:0;background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff}.secondary{background:#18181d;border:1px solid var(--line);color:#fff}.danger{background:#321316;border:1px solid #6b1d25;color:#fecaca}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-size:12px}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#14251a;color:#86efac;font-size:11px}.pill.warn{background:#292217;color:#fcd34d}.pill.bad{background:#321316;color:#fecaca}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:40px;text-align:center;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:12px;padding:13px;background:#101014}.item strong{display:block}.item span{color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:10}.modalbox{width:min(680px,100%);max-height:90vh;overflow:auto;background:#111116;border:1px solid var(--line);border-radius:20px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}.close{background:none;border:0;color:var(--muted);font-size:22px}.field{margin:12px 0}.field label{display:block;color:#ddd;font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#09090d;color:#fff}.field textarea{min-height:90px}.notice{padding:10px;border-radius:10px;background:#18181d;border:1px solid var(--line);margin-bottom:12px}.mobile{display:none}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);background:#111116;border:1px solid var(--line);border-radius:22px;padding:30px}.login h1{margin:18px 0 6px}.login p{color:var(--muted);line-height:1.5}.login .primary{width:100%;margin-top:8px}.link{border:0;background:none;color:#c4b5fd}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.mobile{display:flex;gap:6px;overflow:auto;padding:10px;border-bottom:1px solid var(--line);background:#0c0c10}.mobile button{white-space:nowrap;background:#17171c;border:1px solid var(--line)}.main{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.user{display:none}}@media(max-width:520px){.cards{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.table{min-width:720px}.card{overflow:auto}}</style></head><body><div id="root"></div><script>
const URL='https://hkraryqoziravulvqkid.supabase.co',KEY='sb_publishable_ZC4p3GU0udH5eboge8QqeA_yhpJBXUl',sb=window.supabase.createClient(URL,KEY);let user=null,cache={funnels:[],products:[],gateways:[]};const root=document.getElementById('root');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function nav(){return [['overview','Visão geral'],['funnels','Funis'],['products','Produtos'],['checkout','Checkout Engine'],['gateways','Gateways'],['transactions','Transações'],['sales','Vendas'],['clients','Clientes'],['chats','Chats'],['analytics','Analytics'],['attribution','Atribuição'],['automations','Automações'],['integrations','Integrações'],['settings','Configurações'],['security','Segurança'],['logs','Auditoria']]}
function login(){root.innerHTML=`<main class="loginwrap"><section class="login"><div class="brand"><div class="mark">A</div><div><b>ALTHEA PAY</b><small>Control Center</small></div></div><h1>Entrar</h1><p>Centro de controle de funis, checkout, gateways, transações, atribuição e automações.</p><form id="lf"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="pass" type="password" required minlength="6"></div><button class="primary">Entrar</button></form><div id="loginmsg"></div><p>Primeiro acesso? <button class="link" id="signup">Criar conta</button></p></section></main>`;lf.onsubmit=async e=>{e.preventDefault();let r=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(r.error)loginmsg.innerHTML=`<div class="notice">${esc(r.error.message)}</div>`;else boot()};signup.onclick=async()=>{let e=prompt('E-mail:');if(!e)return;let p=prompt('Senha (mín. 6):');if(!p)return;let r=await sb.auth.signUp({email:e,password:p});alert(r.error?r.error.message:'Conta criada. Confira o e-mail se a confirmação estiver habilitada.')}}
function shell(){root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="mark">A</div><div><b>ALTHEA PAY</b><small>Control Center</small></div></div><nav class="nav">${nav().map(x=>`<button data-s="${x[0]}">${x[1]}</button>`).join('')}</nav><button class="secondary logout" style="width:calc(100% - 36px)" id="out">Sair</button></aside><div><div class="mobile">${nav().map(x=>`<button data-s="${x[0]}">${x[1]}</button>`).join('')}</div><main class="main"><div class="top"><div><h1 id="title">Visão geral</h1><p>Operação centralizada e monitorada.</p></div><div class="user">${esc(user?.email)}</div></div>${nav().map(x=>`<section id="sec-${x[0]}" class="section"></section>`).join('')}</main></div></div>`;document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>go(b.dataset.s));out.onclick=async()=>{await sb.auth.signOut();user=null;login()};go('overview')}
function go(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById('sec-'+id).classList.add('active');document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('active',b.dataset.s===id));title.textContent=nav().find(x=>x[0]===id)?.[1]||id;render(id)}
function modal(title,body){let d=document.createElement('div');d.className='modal';d.id='modal';d.innerHTML=`<div class="modalbox"><div class="modalhead"><h3>${title}</h3><button class="close" onclick="modalClose()">×</button></div>${body}</div>`;document.body.appendChild(d)}function modalClose(){document.getElementById('modal')?.remove()}
async function count(t){let r=await sb.from(t).select('*',{count:'exact',head:true});return r.count||0}
async function render(id){let el=document.getElementById('sec-'+id);if(id==='overview')return overview(el);if(id==='funnels')return funnels(el);if(id==='products')return products(el);if(id==='checkout')return checkout(el);if(id==='gateways')return gateways(el);if(id==='transactions')return transactions(el);if(id==='sales')return simpleData(el,'sales','Vendas');if(id==='clients')return simpleData(el,'clients','Clientes');if(id==='chats')return simpleData(el,'chats','Chats');if(id==='analytics')return analytics(el);if(id==='attribution')return attribution(el);if(id==='automations')return automations(el);if(id==='integrations')return integrations(el);if(id==='settings')return settings(el);if(id==='security')return security(el);if(id==='logs')return logs(el);}
async function overview(el){let [f,p,t,c,e]=await Promise.all(['funnels','products','gateway_transactions','checkout_sessions','integration_events'].map(count));el.innerHTML=`<div class="cards"><div class="card"><div class="label">Funis</div><div class="value">${f}</div></div><div class="card"><div class="label">Produtos</div><div class="value">${p}</div></div><div class="card"><div class="label">Transações Core</div><div class="value">${t}</div></div><div class="card"><div class="label">Checkouts</div><div class="value">${c}</div></div></div><div class="grid2" style="margin-top:14px"><div class="card"><h3>Core operacional</h3><div class="list"><div class="item"><strong>Gateway Orchestrator</strong><span class="pill">Ativo</span></div><div class="item"><strong>Checkout Engine</strong><span>Checkout, order bump, upsell e recuperação.</span></div><div class="item"><strong>Attribution</strong><span>UTM, click IDs e sessão até compra.</span></div><div class="item"><strong>Webhooks</strong><span>Eventos, idempotência e saúde de conexão.</span></div></div></div><div class="card"><h3>Princípio financeiro</h3><p style="color:var(--muted);line-height:1.6">O ALTHEA é a camada de controle e inteligência. A liquidação financeira permanece nos gateways externos; o Core espelha estados e operações.</p></div></div>`}
async function funnels(el){let r=await sb.from('funnels').select('*').order('created_at',{ascending:false});cache.funnels=r.data||[];el.innerHTML=`<div class="toolbar"><div><h2>Funis</h2><p style="color:var(--muted)">Conecte e controle múltiplos funis.</p></div><button class="primary" onclick="openFunnel()">+ Conectar funil</button></div><div class="card">${cache.funnels.length?`<table class="table"><tr><th>Funil</th><th>Status</th><th>URL</th><th>Última comunicação</th><th>Ações</th></tr>${cache.funnels.map(f=>`<tr><td><strong>${esc(f.nome)}</strong></td><td>${badge(f.status)}</td><td>${esc(f.url||'—')}</td><td>${f.last_communication?new Date(f.last_communication).toLocaleString('pt-BR'):'—'}</td><td><button class="secondary" onclick="openFunnel('${f.id}')">Editar</button> <button class="secondary" onclick="disconnectFunnel('${f.id}')">Desconectar</button> <button class="danger" onclick="deleteFunnel('${f.id}')">Excluir</button></td></tr>`).join('')}</table>`:'<div class="empty">Nenhum funil conectado.</div>'}</div>`}
function badge(s){return `<span class="pill ${s==='failed'?'bad':s==='pending'?'warn':''}">${esc(s||'active')}</span>`}
function openFunnel(id){let f=cache.funnels.find(x=>x.id===id);modal(f?'Editar funil':'Conectar novo funil',`<form id="funnelForm"><div class="field"><label>Nome</label><input id="fName" required value="${esc(f?.nome)}"></div><div class="field"><label>URL</label><input id="fUrl" type="url" value="${esc(f?.url)}"></div><div class="field"><label>Tipo de conexão</label><select id="fType"><option>script</option><option>api</option><option>webhook</option><option>github</option><option>vercel</option><option>wordpress</option></select></div><div class="field"><label>Endpoint / código</label><textarea id="fEndpoint">${esc(f?.endpoint)}</textarea></div><button class="primary">Salvar</button></form>`);funnelForm.onsubmit=async e=>{e.preventDefault();let data={nome:fName.value.trim(),url:fUrl.value.trim()||null,endpoint:fEndpoint.value.trim()||null,status:f?.status||'active',user_id:user.id};let r=f?await sb.from('funnels').update(data).eq('id',f.id).eq('user_id',user.id):await sb.from('funnels').insert({id:crypto.randomUUID(),...data});if(r.error)alert(r.error.message);else{modalClose();go('funnels')}}}
async function disconnectFunnel(id){if(!confirm('Desconectar? O funil externo não será apagado.'))return;await sb.from('funnels').update({status:'disconnected'}).eq('id',id).eq('user_id',user.id);await sb.from('funnel_connections').update({status:'disconnected'}).eq('funnel_id',id).eq('user_id',user.id);go('funnels')}async function deleteFunnel(id){let f=cache.funnels.find(x=>x.id===id),v=prompt('Digite o nome exato para excluir do ALTHEA:\n\n'+(f?.nome||''));if(v!==f?.nome)return;await sb.from('funnel_connections').delete().eq('funnel_id',id).eq('user_id',user.id);let r=await sb.from('funnels').delete().eq('id',id).eq('user_id',user.id);if(r.error)alert(r.error.message);else go('funnels')}
async function products(el){let r=await sb.from('products').select('*').order('created_at',{ascending:false});cache.products=r.data||[];el.innerHTML=`<div class="toolbar"><div><h2>Produtos</h2><p style="color:var(--muted)">Catálogo que alimenta checkout e ofertas.</p></div><button class="primary" onclick="openProduct()">+ Novo produto</button></div><div class="card">${cache.products.length?`<table class="table"><tr><th>Produto</th><th>Preço</th><th>Ativo</th><th>Ações</th></tr>${cache.products.map(p=>{let d=p.data||{};return `<tr><td><strong>${esc(d.name||d.nome||'Produto')}</strong><br><span style="color:var(--muted)">${esc(d.description||'')}</span></td><td>${money(d.price||d.amount)}</td><td>${badge(d.status||'active')}</td><td><button class="danger" onclick="removeProduct('${p.id}')">Excluir</button></td></tr>`}).join('')}</table>`:'<div class="empty">Nenhum produto cadastrado.</div>'}</div>`}
function openProduct(){modal('Novo produto',`<form id="productForm"><div class="field"><label>Nome</label><input id="pn" required></div><div class="field"><label>Preço (BRL)</label><input id="pp" type="number" step="0.01" min="0" required></div><div class="field"><label>Descrição</label><textarea id="pd"></textarea></div><button class="primary">Criar produto</button></form>`);productForm.onsubmit=async e=>{e.preventDefault();let r=await sb.from('products').insert({id:crypto.randomUUID(),user_id:user.id,data:{name:pn.value,price:Number(pp.value),description:pd.value,status:'active'}});if(r.error)alert(r.error.message);else{modalClose();go('products')}}}async function removeProduct(id){if(confirm('Excluir produto do ALTHEA?')){await sb.from('products').delete().eq('id',id).eq('user_id',user.id);go('products')}}
async function checkout(el){let r=await sb.from('checkout_sessions').select('*').order('created_at',{ascending:false}).limit(30);let rows=r.data||[];el.innerHTML=`<div class="toolbar"><div><h2>Checkout Engine</h2><p style="color:var(--muted)">Crie sessões, ofertas e simule o fluxo completo antes de conectar um gateway real.</p></div><button class="primary" onclick="newCheckout()">+ Nova sessão</button></div><div class="grid2"><div class="card"><h3>Funil de conversão</h3><div class="list"><div class="item"><strong>Checkout iniciado</strong><span>Captura sessão + atribuição.</span></div><div class="item"><strong>Order Bump</strong><span>Oferta complementar na mesma sessão.</span></div><div class="item"><strong>Upsell</strong><span>Oferta pós-compra preparada no Core.</span></div><div class="item"><strong>Recuperação</strong><span>Eventos de abandono prontos para automação.</span></div></div></div><div class="card"><h3>Sessões recentes</h3>${rows.length?rows.map(x=>`<div class="item" style="margin-bottom:8px"><strong>${money(x.amount)} · ${badge(x.status)}</strong><span>${esc(x.customer?.name||x.customer?.email||'Cliente anônimo')} · ${new Date(x.created_at).toLocaleString('pt-BR')}</span></div>`).join(''):'<div class="empty">Nenhuma sessão.</div>'}</div></div>`}
function newCheckout(){modal('Nova sessão de checkout',`<form id="checkoutForm"><div class="field"><label>Funil</label><select id="cf">${cache.funnels.length?cache.funnels.map(f=>`<option value="${f.id}">${esc(f.nome)}</option>`).join(''):'<option value="">Nenhum funil cadastrado</option>'}</select></div><div class="field"><label>Produto</label><select id="cp">${cache.products.length?cache.products.map(p=>{let d=p.data||{};return `<option value="${p.id}" data-price="${Number(d.price||d.amount||0)}">${esc(d.name||d.nome||'Produto')} — ${money(d.price||d.amount)}</option>`}).join(''):'<option value="">Nenhum produto</option>'}</select></div><div class="field"><label>Valor</label><input id="ca" type="number" step="0.01" min="0" value="0"></div><div class="field"><label>Cliente</label><input id="cn" placeholder="Nome"></div><div class="field"><label>E-mail</label><input id="ce" type="email" placeholder="cliente@email.com"></div><div class="field"><label>UTM source</label><input id="us" placeholder="instagram"></div><div class="field"><label>UTM campaign</label><input id="uc" placeholder="campanha"></div><button class="primary">Criar checkout</button></form>`);if(cp)cp.onchange=()=>{ca.value=cp.options[cp.selectedIndex]?.dataset.price||0};cp?.dispatchEvent(new Event('change'));checkoutForm.onsubmit=async e=>{e.preventDefault();let key='chk_'+crypto.randomUUID();let r=await sb.from('checkout_sessions').insert({id:crypto.randomUUID(),user_id:user.id,funnel_id:cf.value||null,product_id:cp.value||null,status:'started',amount:Number(ca.value||0),currency:'BRL',customer:{name:cn.value,email:ce.value},attribution:{utm_source:us.value,utm_campaign:uc.value},metadata:{idempotency_key:key}}).select().single();if(r.error)alert(r.error.message);else{await sb.from('checkout_events').insert({user_id:user.id,checkout_id:r.data.id,event_type:'checkout_started',external_id:key,payload:{amount:Number(ca.value||0)}});modalClose();go('checkout')}}}
async function gateways(el){let r=await sb.from('gateways').select('*').order('created_at',{ascending:false});cache.gateways=r.data||[];el.innerHTML=`<div class="toolbar"><div><h2>Gateways</h2><p style="color:var(--muted)">Multi-gateway, routing e Sandbox.</p></div><button class="primary" onclick="openGateway()">+ Adicionar</button></div><div class="card">${cache.gateways.length?`<table class="table"><tr><th>Gateway</th><th>Provedor</th><th>Ambiente</th><th>Status</th><th>Ações</th></tr>${cache.gateways.map(g=>{let d=g.data||{};return `<tr><td><strong>${esc(d.name||'Gateway')}</strong></td><td>${esc(d.provider||'custom')}</td><td>${esc(d.environment||'sandbox')}</td><td>${badge(d.status||'active')}</td><td><button class="secondary" onclick="sandboxTest('${g.id}')">Testar</button> <button class="danger" onclick="removeGateway('${g.id}')">Excluir</button></td></tr>`}).join('')}</table>`:'<div class="empty">Nenhum gateway. Adicione o Sandbox para começar.</div>'}</div>`}function openGateway(){modal('Adicionar gateway',`<form id="gatewayForm"><div class="field"><label>Nome</label><input id="gn" required value="ALTHEA Sandbox"></div><div class="field"><label>Provedor</label><input id="gp" value="simulated"></div><div class="field"><label>Ambiente</label><select id="ge"><option>sandbox</option><option>production</option></select></div><button class="primary">Salvar</button></form>`);gatewayForm.onsubmit=async e=>{e.preventDefault();let r=await sb.from('gateways').insert({id:crypto.randomUUID(),user_id:user.id,data:{name:gn.value,provider:gp.value,environment:ge.value,status:'active'}});if(r.error)alert(r.error.message);else{modalClose();go('gateways')}}}async function removeGateway(id){if(confirm('Excluir gateway do ALTHEA?')){await sb.from('gateways').delete().eq('id',id).eq('user_id',user.id);go('gateways')}}
async function sandboxTest(gid){let f=cache.funnels[0],p=cache.products[0],pd=p?.data||{},amount=Number(pd.price||pd.amount||10),id=crypto.randomUUID(),key='sbx_'+crypto.randomUUID();let r=await sb.from('gateway_transactions').insert({id,user_id:user.id,funnel_id:f?.id||null,product_id:p?.id||null,gateway_id:gid,external_id:'sandbox_'+id,idempotency_key:key,amount,currency:'BRL',status:'approved',customer:{name:'Cliente Sandbox',email:'sandbox@althea.local'},metadata:{sandbox:true,source:'control_center'}}).select().single();if(r.error)return alert(r.error.message);await sb.from('gateway_operation_logs').insert({user_id:user.id,transaction_id:id,gateway_id:gid,operation:'charge',status:'approved',attempt:1,request_meta:{sandbox:true},response_meta:{simulated:true,approved:true}});alert('Transação Sandbox aprovada: '+money(amount));go('transactions')}
async function transactions(el){let r=await sb.from('gateway_transactions').select('*').order('created_at',{ascending:false}).limit(50);let rows=r.data||[];el.innerHTML=`<div class="toolbar"><div><h2>Transações</h2><p style="color:var(--muted)">Espelho operacional dos gateways.</p></div><button class="primary" onclick="go('gateways')">Testar Sandbox</button></div><div class="card">${rows.length?`<table class="table"><tr><th>ID</th><th>Valor</th><th>Status</th><th>Gateway</th><th>Criada</th></tr>${rows.map(x=>`<tr><td>${esc(x.external_id||x.id.slice(0,8))}</td><td>${money(x.amount)}</td><td>${badge(x.status)}</td><td>${esc(x.gateway_id||'—')}</td><td>${new Date(x.created_at).toLocaleString('pt-BR')}</td></tr>`).join('')}</table>`:'<div class="empty">Nenhuma transação. Teste o Sandbox.</div>'}</div>`}
async function simpleData(el,t,name){let r=await sb.from(t).select('*').order('created_at',{ascending:false}).limit(40);let rows=r.data||[];el.innerHTML=`<div class="card"><h2>${name}</h2>${rows.length?rows.map(x=>`<div class="item" style="margin:8px 0"><strong>${esc(x.nome||x.name||x.id||name)}</strong><span>${esc(JSON.stringify(x.data||x.status||x.metadata||'')).slice(0,240)}</span></div>`).join(''):'<div class="empty">Nenhum registro.</div>'}</div>`}
async function analytics(el){let [c,t]=await Promise.all([count('checkout_sessions'),count('gateway_transactions')]);el.innerHTML=`<div class="cards"><div class="card"><div class="label">Sessões de checkout</div><div class="value">${c}</div></div><div class="card"><div class="label">Transações</div><div class="value">${t}</div></div><div class="card"><div class="label">Motor de checkout</div><div class="value">ONLINE</div></div><div class="card"><div class="label">Orquestrador</div><div class="value">ONLINE</div></div></div><div class="card" style="margin-top:14px"><h3>Jornada</h3><p style="color:var(--muted)">page_view → quiz → lead → checkout → bump → upsell → purchase → refund/chargeback. A base de eventos permite calcular conversão, abandono e atribuição.</p></div>`}
async function attribution(el){let r=await sb.from('attribution_sessions').select('*').order('last_seen_at',{ascending:false}).limit(50);let rows=r.data||[];el.innerHTML=`<div class="toolbar"><div><h2>Atribuição</h2><p style="color:var(--muted)">UTM e click IDs ligados à sessão.</p></div><button class="primary" onclick="newAttribution()">+ Registrar sessão</button></div><div class="card">${rows.length?`<table class="table"><tr><th>Source</th><th>Medium</th><th>Campaign</th><th>Click ID</th><th>Última atividade</th></tr>${rows.map(x=>`<tr><td>${esc(x.source||'—')}</td><td>${esc(x.medium||'—')}</td><td>${esc(x.campaign||'—')}</td><td>${esc(x.click_id||'—')}</td><td>${new Date(x.last_seen_at).toLocaleString('pt-BR')}</td></tr>`).join('')}</table>`:'<div class="empty">Nenhuma sessão de atribuição.</div>'}</div>`}function newAttribution(){modal('Registrar atribuição',`<form id="attrForm"><div class="field"><label>Session key</label><input id="ak" required value="sess_${crypto.randomUUID().slice(0,8)}"></div><div class="field"><label>Source</label><input id="asrc" placeholder="instagram"></div><div class="field"><label>Medium</label><input id="amed" placeholder="paid_social"></div><div class="field"><label>Campaign</label><input id="acam"></div><div class="field"><label>Click ID</label><input id="aclick"></div><button class="primary">Salvar sessão</button></form>`);attrForm.onsubmit=async e=>{e.preventDefault();let r=await sb.from('attribution_sessions').upsert({user_id:user.id,session_key:ak.value,source:asrc.value,medium:amed.value,campaign:acam.value,click_id:aclick.value,last_seen_at:new Date().toISOString()},{onConflict:'user_id,session_key'});if(r.error)alert(r.error.message);else{modalClose();go('attribution')}}}
async function automations(el){let r=await sb.from('automation_rules').select('*').order('created_at',{ascending:false}),rows=r.data||[];el.innerHTML=`<div class="toolbar"><div><h2>Automações</h2><p style="color:var(--muted)">Eventos transformados em ações.</p></div><button class="primary" onclick="newAutomation()">+ Nova regra</button></div><div class="card">${rows.length?rows.map(x=>`<div class="item" style="margin-bottom:8px"><strong>${esc(x.name)}</strong><span>${esc(x.status)} · ${esc(x.trigger_config?.event||'evento')} → ${esc(x.action_config?.action||'ação')}</span></div>`).join(''):'<div class="empty">Nenhuma automação.</div>'}</div>`}function newAutomation(){modal('Nova automação',`<form id="autoForm"><div class="field"><label>Nome</label><input id="autoName" required placeholder="Recuperar checkout abandonado"></div><div class="field"><label>Evento</label><select id="autoEvent"><option>checkout_started</option><option>checkout_abandoned</option><option>purchase</option><option>payment_failed</option><option>webhook_failed</option><option>chat_started</option></select></div><div class="field"><label>Ação</label><select id="autoAction"><option>notify</option><option>send_message</option><option>retry_webhook</option><option>create_task</option><option>tag_client</option></select></div><button class="primary">Criar</button></form>`);autoForm.onsubmit=async e=>{e.preventDefault();let r=await sb.from('automation_rules').insert({user_id:user.id,name:autoName.value,status:'draft',trigger_config:{event:autoEvent.value},action_config:{action:autoAction.value}});if(r.error)alert(r.error.message);else{modalClose();go('automations')}}}
async function integrations(el){let r=await sb.from('integration_events').select('*').order('created_at',{ascending:false}).limit(30);let rows=r.data||[];el.innerHTML=`<div class="card"><h2>Integrações em tempo real</h2><p style="color:var(--muted)">Eventos recebidos, idempotência e comunicação com funis.</p>${rows.length?rows.map(x=>`<div class="item" style="margin:8px 0"><strong>${esc(x.event_type||x.type||'evento')}</strong><span>${esc(x.status||'received')} · ${x.created_at?new Date(x.created_at).toLocaleString('pt-BR'):''}</span></div>`).join(''):'<div class="empty">Nenhum evento recente.</div>'}</div>`}
async function settings(el){let r=await sb.from('platform_settings').select('*').eq('user_id',user.id).maybeSingle(),d=r.data?.data||{};el.innerHTML=`<div class="grid2"><div class="card"><h2>Configurações</h2><form id="settingsForm"><div class="field"><label>Nome</label><input id="setName" value="${esc(d.name||'ALTHEA PAY')}"></div><div class="field"><label>Idioma</label><select id="setLang"><option>pt-BR</option><option>en</option><option>es</option></select></div><div class="field"><label>Moeda</label><select id="setCurrency"><option>BRL</option><option>USD</option><option>EUR</option></select></div><div class="field"><label>Fuso</label><input id="setTz" value="${esc(d.timezone||'America/Sao_Paulo')}"></div><button class="primary">Salvar</button></form></div><div class="card"><h2>Arquitetura</h2><div class="list"><div class="item"><strong>Multi-gateway</strong><span>Rotas, prioridade e fallback.</span></div><div class="item"><strong>White-label</strong><span>Suporte público sem expor a marca ALTHEA.</span></div><div class="item"><strong>API/Webhooks</strong><span>Chaves, scopes, assinatura, retry e replay.</span></div><div class="item"><strong>IA operacional</strong><span>Próxima camada de inteligência.</span></div></div></div></div>`;settingsForm.onsubmit=async e=>{e.preventDefault();let r=await sb.from('platform_settings').upsert({user_id:user.id,data:{name:setName.value,language:setLang.value,currency:setCurrency.value,timezone:setTz.value},updated_at:new Date().toISOString()});alert(r.error?'Erro: '+r.error.message:'Configurações salvas.')}}
async function security(el){el.innerHTML=`<div class="grid2"><div class="card"><h2>Segurança</h2><div class="list"><div class="item"><strong>RLS</strong><span class="pill">Ativo</span></div><div class="item"><strong>Isolamento</strong><span>Dados filtrados pelo usuário autenticado.</span></div><div class="item"><strong>JWT</strong><span>Funções de usuário protegidas.</span></div><div class="item"><strong>Segredos</strong><span>Credenciais de gateway não ficam no navegador.</span></div></div></div><div class="card"><h2>Próxima camada</h2><p style="color:var(--muted)">2FA, sessões/dispositivos, API keys com scopes, rotação e auditoria avançada.</p></div></div>`}async function logs(el){let r=await sb.from('logs').select('*').order('created_at',{ascending:false}).limit(50),rows=r.data||[];el.innerHTML=`<div class="card"><h2>Auditoria</h2>${rows.length?rows.map(x=>`<div class="item" style="margin:8px 0"><strong>${esc(x.action||'ação')}</strong><span>${esc(x.resource||'')} · ${esc(x.details||'')} · ${x.created_at?new Date(x.created_at).toLocaleString('pt-BR'):''}</span></div>`).join(''):'<div class="empty">Nenhum registro.</div>'}</div>`}
async function boot(){let r=await sb.auth.getSession();if(r.data.session){user=r.data.session.user;shell()}else login()}sb.auth.onAuthStateChange((_e,s)=>{if(s&&!user){user=s.user;shell()}else if(!s&&user){user=null;login()}});boot();
</script></body></html>
